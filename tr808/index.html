<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caixa de ritmos analógica (clone em Web Audio)</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
:root{--pagina:#10151c;--chapa:#1d2733;--faixa:#2b3a4d;--faixa2:#34465c;--tinta:#e9eef4;--apagado:#97a6b8;--acento:#f0b24a;--vivo:#4fd1c5;--perigo:#e5604f;--foco:#6cb4ff;--sulco:#0f1620;
  --g1:#4fd1c5;--g2:#5aa9ff;--g3:#b48cff;--g4:#e9eef4;
  --f-rot:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--f-texto:"Barlow","Helvetica Neue",Arial,sans-serif;color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,#1a2330 0%,var(--pagina) 65%) fixed var(--pagina);color:var(--tinta);font-family:var(--f-texto);line-height:1.35}
button,select,input{font:inherit;color:inherit;touch-action:manipulation}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--foco);outline-offset:2px}
.pagina{max-width:1500px;margin:0 auto;padding:14px max(10px,env(safe-area-inset-left,0px)) 80px}
h1{font-family:var(--f-rot);font-weight:600;letter-spacing:.06em;font-size:1.1rem;margin:0 0 8px;color:var(--apagado)}
.rolagem{overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.painel{min-width:1420px;background:linear-gradient(180deg,#223041,var(--chapa));border:1px solid #3a4c63;border-radius:12px;padding:14px 16px 16px;box-shadow:0 10px 30px #0008, inset 0 1px 0 #ffffff12}
.topo{display:flex;align-items:center;gap:18px;margin-bottom:10px}
.topo .titulo{font-family:var(--f-rot);letter-spacing:.14em;color:var(--acento);font-size:1.15rem}
.meio{display:grid;grid-template-columns:372px minmax(0,1fr);gap:12px}
.esq{display:grid;grid-template-columns:150px 1fr;min-width:0;grid-template-areas:"mode inst" "clear inst" "auto auto" "tempo tempo";gap:6px 10px;background:var(--faixa);border-radius:10px;padding:10px;align-content:start}
.esq .mode{grid-area:mode}.esq .inst{grid-area:inst}.esq .clear{grid-area:clear}.esq .auto{grid-area:auto}.esq .tempo{grid-area:tempo}
.vozes{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:0;background:var(--faixa);border-radius:10px;align-content:start}
.col{display:grid;grid-template-rows:96px 96px 96px 104px 44px;min-width:0;justify-items:center;align-items:center;border-left:1px solid #0003;padding:4px 2px;position:relative}
.col:first-child{border-left:0}
.col .nome{font-family:var(--f-rot);letter-spacing:.05em;font-size:.82rem;text-align:center;background:var(--faixa2);border-radius:4px;padding:3px 4px;width:92%;line-height:1.05}
.ctl{display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.ctl .rot{font-family:var(--f-rot);letter-spacing:.06em;font-size:.78rem;color:var(--apagado);text-transform:uppercase}
.aprende [data-ctl]{cursor:crosshair}
.aprende [data-ctl]:hover{outline:1px dashed var(--acento);outline-offset:2px}
[data-ctl].selecionado{outline:2px solid var(--acento);outline-offset:2px;border-radius:8px}
.knob{width:56px;height:56px;border-radius:50%;cursor:grab;touch-action:none;display:block}
.knob.grande{width:112px;height:112px}.knob.pequeno{width:44px;height:44px}
.knob:active{cursor:grabbing}
.knob svg{width:100%;height:100%;display:block;overflow:visible}
.knob .base{fill:#0e141b;stroke:#4b6079;stroke-width:1.5}.knob .tampa{fill:#2a3a4d;stroke:#7a8ea6;stroke-width:1}.knob .pt{stroke:var(--acento);stroke-width:3.2;stroke-linecap:round}
.knob .marca{fill:#7186a0}
.rotulos{position:relative}
.rotulos .etq{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-rot);font-size:.78rem;line-height:1;min-width:30px;min-height:24px;padding:2px 4px;border-radius:4px;border:1px solid #4b6079;background:#26384b;color:var(--tinta);cursor:pointer;white-space:nowrap}
.rotulos .etq[aria-checked=true]{background:var(--acento);color:#161b22;border-color:var(--acento)}
.rotulos .centro{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.slide{display:flex;gap:4px;align-items:center}
.slide.v{flex-direction:column}
.slide.h{flex-direction:column-reverse;align-items:flex-start}
.slide.par{flex-direction:column-reverse;align-items:center}
.slide.par .op:nth-child(2){position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);min-width:0;min-height:0;padding:0;border:0}
.slide.par .op{font-size:.7rem;min-width:60px;min-height:44px}
.slide .trilho{position:relative;background:#0e141b;border:1px solid #4b6079;border-radius:6px}
.slide.v .trilho{width:16px}.slide.par .trilho{height:44px!important}.slide.h .trilho{height:16px}
.slide .polegar{position:absolute;background:linear-gradient(180deg,#8da2bb,#516782);border:1px solid #c0cfe0;border-radius:3px}
.slide.v .polegar{left:-4px;right:-4px;height:18px}.slide.h .polegar{top:-4px;bottom:-4px;width:22px}
.slide .opcoes{display:flex;gap:2px}.slide.v .opcoes{flex-direction:column}
.slide .op{min-width:44px;min-height:44px;background:transparent;border:1px solid #3f566e;border-radius:4px;font-family:var(--f-rot);font-size:.8rem;color:var(--apagado);cursor:pointer;padding:0 6px}
.slide .op[aria-checked=true]{color:var(--tinta);border-color:var(--acento)}
.btn{min-width:44px;min-height:44px;border-radius:8px;border:1px solid #5a6f88;background:#2e4157;color:var(--tinta);cursor:pointer;font-family:var(--f-rot);letter-spacing:.06em;font-size:.9rem;padding:0 12px}
.btn:active{background:#3b5470}
.btn.liga[aria-pressed=true]{background:var(--acento);color:#161b22;border-color:var(--acento)}
.btn.vermelho{background:#6d2a26;border-color:#c0645a}.btn.vermelho.armado{background:var(--perigo);box-shadow:0 0 0 2px #fff4}
.led{display:inline-block;width:9px;height:9px;border-radius:50%;background:#46343a;box-shadow:inset 0 0 0 1px #0006}
.led.on{background:var(--perigo);box-shadow:0 0 8px var(--perigo)}
.led.verde.on{background:var(--vivo);box-shadow:0 0 8px var(--vivo)}
.baixo{display:grid;grid-template-columns:140px 110px 90px minmax(800px,1fr) 140px;gap:10px;margin-top:12px;background:var(--faixa);border-radius:10px;padding:10px;align-items:center}
.passos{display:grid;grid-template-columns:repeat(16,minmax(44px,1fr));gap:6px}
.passo{position:relative;min-height:62px;border-radius:6px;border:1px solid #0008;color:#10151c;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px 0}
.passo .n{font-family:var(--f-rot);font-size:.78rem;color:var(--tinta);position:absolute;top:-17px}
.passo .abaixo{position:absolute;bottom:-20px;font-family:var(--f-rot);font-size:.85rem;color:var(--apagado)}
.passo .led{margin-top:2px}
.passo.g1{background:var(--g1)}.passo.g2{background:var(--g2)}.passo.g3{background:var(--g3)}.passo.g4{background:var(--g4)}
.passo.aceso{box-shadow:0 0 0 2px #fff, 0 0 10px #fffa;filter:brightness(1.12)}
.passo:not(.aceso){filter:brightness(.62)}
.passo.cabeca{outline:3px solid var(--acento);outline-offset:1px}
.passos-linha{padding-bottom:26px;padding-top:16px}
.start{min-height:62px;font-size:1.05rem;background:#7a5a1e;border-color:#f0b24a}
.pre{display:flex;gap:6px;align-items:center}
.faixa-acess{margin-top:18px;background:#161d27;border:1px dashed #556b85;border-radius:12px;padding:12px 14px}
.faixa-acess h2{font-family:var(--f-rot);letter-spacing:.08em;font-size:.95rem;margin:0 0 8px;color:var(--apagado)}
.faixa-acess .tag{background:#3b2f1f;color:var(--acento);border-radius:4px;padding:1px 6px;font-size:.75rem;margin-left:6px;letter-spacing:.04em}
.grade-acess{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.bloco{background:#1c2633;border-radius:8px;padding:10px}
.bloco h3{font-family:var(--f-rot);letter-spacing:.06em;font-size:.9rem;margin:0 0 6px;color:var(--tinta)}
.linha{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.linha label{font-size:.85rem;color:var(--apagado)}
select,input[type=number]{min-height:44px;background:#0f1620;border:1px solid #4b6079;border-radius:6px;padding:0 8px}
input[type=checkbox]{width:28px;height:28px;margin:8px}
.pads{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.nota{font-size:.82rem;color:var(--apagado)}
.mapa{width:100%;border-collapse:collapse;font-size:.85rem}.mapa td,.mapa th{padding:2px 6px;border-bottom:1px solid #2b3a4d;text-align:left}
#estado-msg{min-height:1.3em;color:var(--apagado);font-size:.85rem;margin-top:8px}
.esq>div>.rot{font-family:var(--f-rot);letter-spacing:.06em;font-size:.78rem;color:var(--apagado);text-transform:uppercase}
.esq .inst .rotulos{margin:0 auto}
.linha label{min-height:44px;display:inline-flex;align-items:center}
input[type=file]{min-height:44px;max-width:100%}
.slide{min-width:44px;cursor:pointer}
</style>
</head>
<body>
<div class="pagina">
<div class="rolagem"><div id="painel" class="painel" role="group" aria-label="Painel da caixa de ritmos"></div></div>
<section id="acess" class="faixa-acess" aria-labelledby="t-acess">
<h2 id="t-acess">Acessórios <span class="tag">não são do original</span></h2>
<div id="acess-grade" class="grade-acess"></div>
<div id="estado-msg" role="status"></div>
</section>
</div>
<script type="text/plain" id="dsp">
/* Motor de som do clone do TR-808. Roda igual em três lugares: AudioWorklet (página), ScriptProcessor (reserva)
   e Node (tests/medicao/tr808). Por isso não usa nada do navegador. Marcas (a) (b) (c): ver docs/pesquisa/tr808.md.
   VERSÃO 1: bumbo com subida de pitch no ataque, "pitch sigh", TONE, pulso saturado e accent. */
const T_TRIG = 0.001;                    // (a) COMMON TRIG alargado para ~1 ms (p.4)
const V_NORMAL = 4, V_ACC_MAX = 14;      // (a) trigger ~4 V sem accent; até 14 V com accent no máximo (p.4)
const V_POR_UNIDADE = 0.1;               // (c) 1,0 digital = 10 V de pico no mix; só dá folga de cabeça
const GANHO_MIX = { bd: 1.5, sd: 1.0, lt: 1.0, mt: 1.0, ht: 1.0, oh: 0.59, ch: 0.70, cy: 0.70, cb: 0.70, cp: 1.0, ma: 1.0, rs: 1.0 };   // (c, sobre a) R75 33k / R de mistura: BD 22k, OH 56k, CH/CB/CY 47k, demais 33k (Parte C, seção 10)           // (c, sobre a) R75 33k / R5 22k (Parte C, seção 10)
/* Bumbo. f0: decisão do usuário (Werner/amostras). tDecay e Vpp: (a) tabela p.14, critério 1/10 do Vpp. */
const BD = {
  f0: 49.5, tDecay: [0.050, 0.300, 0.800], vppNormal: 3.5, vppAccent: 10,
  riseRatio: 2.81,       // (c sobre a) sqrt((R166+R165)/R166) = sqrt(53,8k/6,8k) com Q43 saturado (Parte B 3.1); o texto da Roland diz "twice", Werner ">1 oitava"
  tRise: 0.004,          // (a) Q43 conduz ~4 ms (p.5)
  tauRise: 0.0015,       // (c) volta do ratio a 1 em ~2 ms depois dos 4 ms (S4: ~6 ms no total); forma sem fonte
  sighSt: 12 * Math.log2(58 / 49.5), tauSigh: 0.1,  // (b) S4 Fig. 11: 48 a 58 Hz nos primeiros 0,3 s (decisão do usuário: segue o Werner); parte de 58 Hz e assenta em f0. (c) τ = 0,1 s: forma sem fonte
  tauClick: 70e-6,       // (c sobre a) R162·C40 = 4,7k × 15 nF
  vk: 15.722, k: 0.47976,   // calibrados contra a tabela p.14 (3,5 e 10 Vpp com TONE e DECAY a 12 h): VK ajusta a razão accent/normal, k o nível
  kClick: 0.07196         // (c) SEM FONTE: o click vale 15 % de k por volt de trigger. Existe só para o accent mudar o timbre (decisão); ajustar de ouvido
};
const RC_TONE = { r171: 220, r172: 10e3, vr5: 10e3, c45: 0.1e-6 };   // (a) Parte B 3.1; S4 Tab. 1: R_eq = R171 + (R172 ∥ VR5)
/** TONE 0 a 1 (horário = mais claro, (c)) -> corte (Hz) do passa-baixas de 1 polo. Lei do potenciômetro C: (c). */
const fcTone = th => { const r = (Math.pow(10, 2 * (1 - th)) - 1) / 99, vr = RC_TONE.vr5 * r, par = vr * RC_TONE.r172 / (vr + RC_TONE.r172 || 1), req = RC_TONE.r171 + par; return 1 / (2 * Math.PI * req * RC_TONE.c45); };
const T20 = (tab, p) => p <= 0.5 ? tab[0] * Math.pow(tab[1] / tab[0], p / 0.5) : tab[1] * Math.pow(tab[2] / tab[1], (p - 0.5) / 0.5);   // (c) interpolação log entre os 3 pontos
/** Amplitude do pulso depois do modelador (D53): saturação suave. (c) forma; VK calibrado contra a tabela. */
const pulsoBd = V => BD.vk * Math.tanh(V / BD.vk);

class Bumbo {
  constructor(fs) { this.fs = fs; this.x = 0; this.y = 0; this.t = 1e9; this.V = V_NORMAL; this.lp = 0; this.ck = 0; this.sinal = 0; }
  trig(V) { this.t = 0; this.V = V; this.A = pulsoBd(V); this.bordaIni = true; this.bordaFim = true; }
  /** p = { level, tone, decay } de 0 a 1. Devolve volts no MULTI OUT. */
  amostra(p) {
    const fs = this.fs, t = this.t, dt = 1 / fs;
    // frequência: f0 com "sigh" × subida do Q43 nos primeiros ms
    const sigh = 1 + (Math.pow(2, BD.sighSt / 12) - 1) * Math.exp(-t / BD.tauSigh);
    const sobe = t < BD.tRise ? BD.riseRatio : 1 + (BD.riseRatio - 1) * Math.exp(-(t - BD.tRise) / BD.tauRise);
    const w = 2 * Math.PI * BD.f0 * sigh * sobe / fs, a = Math.exp(-Math.LN10 / T20(BD.tDecay, p.decay) / fs);
    const c = Math.cos(w), s = Math.sin(w), x = this.x, y = this.y;
    this.x = a * (x * c - y * s); this.y = a * (x * s + y * c);
    if (t < T_TRIG) this.x += BD.k * this.A / (T_TRIG * fs);
    // "click" do pulso: bordas de subida e descida passam pelo TONE (S7); amplitude proporcional ao trigger, sem saturar
    this.ck *= Math.exp(-dt / BD.tauClick);
    if (this.bordaIni) { this.ck += BD.kClick * this.V; this.bordaIni = false; }
    if (this.bordaFim && t >= T_TRIG) { this.ck -= BD.kClick * this.V; this.bordaFim = false; }
    this.t += dt;
    const fc = fcTone(p.tone), g = 1 - Math.exp(-2 * Math.PI * fc / fs);
    this.lp += g * (this.x + this.ck - this.lp);
    return this.lp * p.level * p.level;
  }
}

/** Fonte de ruído compartilhada (uma amostra por passo, como o gerador único do circuito). Ruído branco gaussiano
    aproximado (soma de 4 uniformes), semente fixa para as medições reproduzirem; passa-baixas de 1 polo em 7,23 kHz
    (R130·C202, lote 6 em diante, Parte C seção 4), normalizado para rms 1. O nível de 130 mV em TP-4 não entra: os ganhos
    seguintes não foram lidos, então cada voz tem seu ganho (c). */
const WN_FC = 7230;
const PN_F0 = 273, PN_Q = 0.74;      // (c sobre a) "ruído rosa" = Sallen-Key passa-baixas de 2 polos aplicado ao WN (Parte C, seção 4); não é −3 dB/oitava
class Ruido {
  constructor(fs, semente = 0x1234abcd) { this.u = semente >>> 0; this.y = 0; this.g = 1 - Math.exp(-2 * Math.PI * WN_FC / fs); this.norma = Math.sqrt((2 - this.g) / this.g); this.wn = 0; this.pn = 0; this.z1 = this.z2 = 0;
    const w0 = 2 * Math.PI * PN_F0 / fs, al = Math.sin(w0) / (2 * PN_Q), a0 = 1 + al, cw = Math.cos(w0);   // biquad passa-baixas (RBJ)
    this.b0 = (1 - cw) / 2 / a0; this.b1 = (1 - cw) / a0; this.b2 = this.b0; this.a1 = -2 * cw / a0; this.a2 = (1 - al) / a0; }
  uni() { let u = this.u; u ^= u << 13; u >>>= 0; u ^= u >>> 17; u ^= u << 5; u >>>= 0; this.u = u; return u / 4294967296 - 0.5; }
  tick() { const b = (this.uni() + this.uni() + this.uni() + this.uni()) * Math.sqrt(3); this.y += this.g * (b - this.y); this.wn = this.y * this.norma;
    const o = this.b0 * this.wn + this.z1; this.z1 = this.b1 * this.wn - this.a1 * o + this.z2; this.z2 = this.b2 * this.wn - this.a2 * o; this.pn = o; return this.wn; }
}
/** Caixa. Dois bridged-T excitados pelo pulso (versão revisada: C58 0,056, C61 0,015, R191 10k, R200 zero; decisão do usuário)
    + ruído branco -> VCA (envelope, SNAPPY) -> passa-altas Sallen-Key (f0 2750 Hz, Q 0,73). TONE mistura os dois osciladores. */
const SD = {
  fGrave: 173.3, qGrave: 16.3, fAgudo: 336.0, qAgudo: 9.9,   // (c sobre a) conta da Fig. 11 com os valores lidos (Parte B 3.2); decay vem do Q
  fHp: 2750, qHp: 0.73,                                      // (c sobre a) Sallen-Key, Parte B 3.2
  tNoise: 0.060,                                             // (c) SEM FONTE: decay do envelope do ruído = decay da tabela (60 ms)
  vk: 18.963, k: 0.28922,        // calibrados contra a tabela p.14 (3 e 10 Vpp, TONE e SNAPPY a 12 h): VK ajusta a razão accent/normal, k o nível
  gNoise: 0.25681                // (c) SEM FONTE: com SNAPPY a 12 h e trigger normal, o ruído tem o mesmo rms dos osciladores nos 30 ms iniciais. O ruído usa V sem saturar (c): é o que faz o accent mudar o timbre
};
class Caixa {
  constructor(fs, fonte) {
    this.fs = fs; this.fonte = fonte; this.t = 1e9; this.V = V_NORMAL; this.A = 0; this.xl = this.yl = this.xh = this.yh = 0;
    const w0 = 2 * Math.PI * SD.fHp / fs, al = Math.sin(w0) / (2 * SD.qHp), a0 = 1 + al, cw = Math.cos(w0);   // biquad passa-altas (RBJ)
    this.b0 = (1 + cw) / 2 / a0; this.b1 = -(1 + cw) / a0; this.b2 = this.b0; this.a1 = -2 * cw / a0; this.a2 = (1 - al) / a0; this.z1 = this.z2 = 0;
    this.rl = { w: 2 * Math.PI * SD.fGrave / fs, a: Math.exp(-(2 * Math.PI * SD.fGrave / (2 * SD.qGrave)) / fs) };
    this.rh = { w: 2 * Math.PI * SD.fAgudo / fs, a: Math.exp(-(2 * Math.PI * SD.fAgudo / (2 * SD.qAgudo)) / fs) };
    this.rl.c = Math.cos(this.rl.w); this.rl.s = Math.sin(this.rl.w); this.rh.c = Math.cos(this.rh.w); this.rh.s = Math.sin(this.rh.w);
  }
  trig(V) { this.t = 0; this.V = V; this.A = SD.vk * Math.tanh(V / SD.vk); }   // (c) pulso saturado; ruído usa V sem saturar
  /** p = { level, tone, snappy } de 0 a 1. Devolve volts no MULTI OUT. */
  amostra(p) {
    const fs = this.fs, t = this.t, l = this.rl, h = this.rh;
    let x = this.xl, y = this.yl; this.xl = l.a * (x * l.c - y * l.s); this.yl = l.a * (x * l.s + y * l.c);
    x = this.xh; y = this.yh; this.xh = h.a * (x * h.c - y * h.s); this.yh = h.a * (x * h.s + y * h.c);
    if (t < T_TRIG) { const e = SD.k * this.A / (T_TRIG * fs); this.xl += e; this.xh += e; }
    const env = Math.exp(-t * Math.LN10 / SD.tNoise), n = this.fonte.wn * env * p.snappy * this.V * SD.gNoise;
    const o = this.b0 * n + this.z1; this.z1 = this.b1 * n - this.a1 * o + this.z2; this.z2 = this.b2 * n - this.a2 * o;
    this.t += 1 / fs;
    return ((1 - p.tone) * this.xl + p.tone * this.xh + o) * p.level * p.level;
  }
}

/** Toms e congas: 3 circuitos (LT/LC, MT/MC, HT/HC), cada um com a chave tom/conga que troca a frequência (SW8, C77/R224).
    Frequências, decays e amplitudes: tabela da p.14 (a), três pontos de TUNING, como decidido (não a fórmula bridged-T).
    Bridged-T excitado por pulso; os diodos de germânio (D80/D81) encurtam a constante de tempo logo após o disparo, então o pitch
    começa mais alto e cai (a, p.6). Os toms recebem ruído "rosa" com decay um pouco mais longo (a, p.6; S10: todos os toms). */

/** Maracas: ruído branco -> VCA Q65 -> passa-altas Sallen-Key (Q68, 10,6 kHz, Q 2,27). Compartilham o circuito do clap (chave MA/CP, um LEVEL só; modo 1 = maracas).

  hp: { f: 10600, q: 2.27 },   // (c sobre a) Parte C, seção 7
  tauA: 0.0155,                // (c sobre a) R341 · C134. A polaridade não foi traçada: assumi que é a SUBIDA (ataque lento de ~15 ms)
  tauD: 0.00562,               // (c) SEM FONTE: descarga (pelo diodo), calibrada para 25 ms desde o disparo ("curto" da tabela, atribuído ao caso sem accent)
  kap: 0.76843,                // (c) compressão do controle do VCA (tanh): calibrada para a razão 3 / 5 Vpp da tabela (trigger de razão 3,5). O decay com accent sai 27,6 ms; o "longo = 35 ms" da tabela NÃO é reproduzido
  k: 0.82462                   // calibrado: 3 Vpp

/* ===== Mixer e master (Parte C, seção 10): IC4A soma (R75 33k ∥ C18 220 pF), VR1 MASTER VOLUME (50k A), IC4B ganho 1,5 (R76 33k / R77 22k, ∥ C22 220 pF),

  g2: 1.5,                    // (c sobre a) R76 / R77
  vRef: 15,                   // (c) 1,0 digital = 15 V de pico na saída HI. Só define o nível digital; o valor dos trilhos (B5) não foi encontrado, o grampeamento é em ±1,0
  lo: 3.3 / (27 + 3.3),       // (c sobre a) saída LO = −19,26 dB contra HI
  polo: 21900                 // (c sobre a) 1 / (2π · 33k · 220 pF) em cada estágio

/** Dois polos analógicos de 21,9 kHz em cascata, em forma digital. Com fs = 48 kHz o polo cai colado em Nyquist, e a bilinear com pré-distorção no corte erra até 3,6 dB;
    por isso o parâmetro Ω (tan(πf/fs) / Ω) é escolhido para minimizar o erro máximo da cascata de 100 Hz a 18 kHz (erro ≈ 1,05 dB a 48 kHz; 0,2 dB a 96 kHz). Acima de 18 kHz

class Polo1 { constructor(om) { const den = 1 + 1 / om; this.b = 1 / den; this.a1 = (1 - 1 / om) / den; this.x1 = 0; this.y1 = 0; } process(x) { const y = this.b * (x + this.x1) - this.a1 * this.y1; this.x1 = x; this.y1 = y; return y; } }

  constructor(fs) { const om = omegaPolos(fs); this.p1 = new Polo1(om); this.p2 = new Polo1(om); }

/* ---------- lógica do sequenciador no painel ---------- */
let rodando = false, cabeca = -1, atualPat = '', clearArmado = false, tClear = 0, pintaPads = () => {};
const alterna = () => { liga(); rodando = !rodando; S(rodando ? 'start' : 'stop'); $('start').setAttribute('aria-pressed', String(rodando)); if (!rodando) cabeca = -1; pinta(); };
function mudouModo() { S('modo', { v: modoMotor() }); S('songTrilha', { tr: estado.sq.instIdx }); desarma(); pinta(); msg(MODOS[estado.sq.modoIdx] + (estado.sq.modoIdx === 3 ? ': toque os botões 1–12 (BASIC RHYTHM) e 13–16 (INTRO/FILL IN).' : estado.sq.modoIdx === 1 || estado.sq.modoIdx === 2 ? ': os 16 botões são os passos do instrumento selecionado.' : estado.sq.modoIdx === 0 ? ': toque CLEAR duas vezes para apagar o pattern selecionado.' : '')); }
function clicaPasso(i) {
  const m = estado.sq.modoIdx, q = estado.sq;
  if (m === 1 || m === 2) {
    const passo = i + (m === 2 ? 16 : 0);
    if (clearArmado) { S('tamanho', { n: passo + 1 }); desarma(); msg('STEP NUMBER: o pattern passa a ter ' + (passo + 1) + ' passo(s).'); }
    else S('alterna', { trilha: POS_TRACK[q.instIdx], passo });
  } else if (m === 3 || m === 5) {
    if (i < 12) { q.selB = i + 1; S('basico', { n: q.selB }); } else { q.selF = i - 11; S('fill', { n: q.selF }); if (m === 5) S('tap'); }
  }
  pinta();
}
function prescaleMudou(i) {
  const m = estado.sq.modoIdx;
  if (m === 1 || m === 2 || clearArmado) { S('prescale', { ps: i + 1 }); if (clearArmado) { desarma(); msg('PRE-SCALE ' + (i + 1) + ' definido para este pattern.'); } }
  else msg('PRE-SCALE só muda em PATTERN WRITE (1st/2nd PART) ou com CLEAR armado.');
  CTL.prescale.pinta();
}
function desarma() { clearArmado = false; clearTimeout(tClear); btnClear.classList.remove('armado'); }
function clearToque() {
  const m = estado.sq.modoIdx;
  if (!clearArmado) { if (m === 4 || m === 5) { msg('CLEAR não age em PLAY/COMPOSE.'); return; } clearArmado = true; btnClear.classList.add('armado'); tClear = setTimeout(desarma, 4000);
    msg('CLEAR armado por 4 s: toque um passo (STEP NUMBER) ou mova o PRE-SCALE; ou toque CLEAR de novo para apagar ' + (m === 0 ? 'o pattern selecionado.' : 'a trilha do instrumento selecionado (' + POS_NOME[estado.sq.instIdx] + ').')); return; }
  desarma(); if (m === 0 || m === 3) { S('limpaPadrao'); msg('Pattern apagado.'); } else { S('limpaTrilha', { trilha: POS_TRACK[estado.sq.instIdx] }); msg('Trilha ' + POS_NOME[estado.sq.instIdx] + ' apagada.'); } pinta();
}
function aoEvento(e) {
  if (!e) return;
  if (e.t === 'passo') { cabeca = e.i; pinta(); } else if (e.t === 'compasso') { atualPat = e.pat; $('comp').textContent = 'compasso ' + (e.c + 1) + ' · ' + e.pat; pinta(); }
  else if (e.t === 'batida') { const l = $('ledTempo'); l.classList.add('on'); setTimeout(() => l.classList.remove('on'), 80); }
  else if (e.t === 'parou') { rodando = false; cabeca = -1; $('start').setAttribute('aria-pressed', 'false'); pinta(); }
}
function pinta() {
  const q = estado.sq, m = q.modoIdx, alvo = twin.seq.alvo(), k = SEQT.indexOf(POS_TRACK[q.instIdx]), part = m === 2 ? 1 : 0;
  btnPasso.forEach((b, i) => {
    let aceso = false;
    if (m === 1 || m === 2) aceso = !!alvo.t[k][i + part * 16];
    else if (m === 3 || m === 5) aceso = i < 12 ? (q.selB === i + 1 && !twin.seq.editaFill) || (i + 1 === Number((atualPat.match(/^b(\d+)/) || [])[1]) && rodando) : (q.selF === i - 11 && twin.seq.editaFill) || (i - 11 === Number((atualPat.match(/^f(\d+)/) || [])[1]) && rodando);
    else if (m === 4) aceso = rodando && (i < 12 ? atualPat.startsWith('b') && Number(atualPat.slice(1)) === i + 1 : atualPat.startsWith('f') && Number(atualPat.slice(1)) === i - 11);
    const cab = rodando && (m === 1 || m === 2 || m === 3 || m === 4 || m === 5) && cabeca >= 0 && cabeca % 16 === i && Math.floor(cabeca / 16) === (m === 2 ? 1 : (m === 1 ? 0 : Math.floor(cabeca / 16)));
    b.classList.toggle('aceso', aceso); b.classList.toggle('cabeca', !!cab); b.querySelector('.led').classList.toggle('on', aceso);
  });
  const p2 = (m === 2) || (rodando && cabeca >= 16 && m !== 1); $('ledP1').classList.toggle('on', !p2); $('ledP2').classList.toggle('on', p2);
  const bk = atualPat ? atualPat.slice(-1) : '', vb = q.varB; $('ledA').classList.toggle('on', rodando ? bk === 'A' : vb !== 'B'); $('ledB').classList.toggle('on', rodando ? bk === 'B' : vb !== 'A');
  for (const id in CTL) if (CTL[id].pinta) CTL[id].pinta();
  pintaBpm();
}
function pintaBpm() { $('bpm').textContent = 'Andamento: ' + Math.round(bpmAtual() * 10) / 10 + ' BPM (por semínima)'; }

  const rotuloVoz = id => { const col = COLS.find(c => c.id === id), m = estado.v[id] && estado.v[id].modo; return col.par ? col.par[m ? 0 : 1] : col.nome; };
  const pads = ['bd', 'sd', 'lt', 'mt', 'ht', 'rs', 'cp', 'cb', 'cy', 'oh', 'ch'].map(id => { const b = el('button', 'btn', ''); b.type = 'button'; b.dataset.pad = id; b.addEventListener('pointerdown', e => { e.preventDefault(); disparar(id, estado.acc); }); b.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); disparar(id, estado.acc); } }); g.appendChild(b); return [b, id]; });

/* ---------- MIDI ---------- */
let acessoMidi = null, ctlSel = null;
function salvaMidi() { salva(); }
function pintaLearn() { const info = $('learnInfo'); document.body.classList.toggle('aprende', midi.learn); btnLearn.setAttribute('aria-pressed', String(!!midi.learn));
  document.querySelectorAll('[data-ctl].selecionado').forEach(e => e.classList.remove('selecionado')); if (ctlSel) { const e = document.querySelector('[data-ctl="' + ctlSel + '"]'); if (e) e.classList.add('selecionado'); }
  const lig = ctlSel && midi.map[ctlSel]; info.textContent = midi.learn ? (ctlSel ? 'Selecionado: ' + CTL[ctlSel].nome + (lig ? ' (ligado ao CC ' + lig.cc + ', canal ' + lig.ch + ')' : ' (sem ligação)') + '. Mexa num knob ou slider do controlador.' : 'MIDI learn ligado: clique num controle do painel e depois mexa num knob do controlador.') : Object.keys(midi.map).length + ' controle(s) ligado(s).'; }
btnLearn.addEventListener('click', () => { midi.learn = !midi.learn; if (!midi.learn) ctlSel = null; pintaLearn(); });
document.addEventListener('pointerdown', e => { if (!midi.learn) return; const c = e.target.closest('[data-ctl]'); if (c && c.dataset.ctl) { ctlSel = c.dataset.ctl; pintaLearn(); } }, true);
document.addEventListener('click', e => { if (midi.learn && e.target.closest('[data-ctl]')) { e.stopPropagation(); e.preventDefault(); } }, true);   // em MIDI learn o clique só seleciona o controle, não o aciona
btnDesf.addEventListener('click', () => { if (ctlSel && midi.map[ctlSel]) { delete midi.map[ctlSel]; salvaMidi(); } pintaLearn(); });
btnTodas.addEventListener('click', () => { midi.map = {}; salvaMidi(); pintaLearn(); });
chkVel.checked = !!midi.vel; limVel.value = String(midi.limiar); selCh.value = String(midi.ch);
chkVel.addEventListener('change', () => { midi.vel = chkVel.checked; salvaMidi(); }); limVel.addEventListener('change', () => { midi.limiar = lim(Math.round(+limVel.value) || 100, 1, 127); limVel.value = String(midi.limiar); salvaMidi(); });
selCh.addEventListener('change', () => { midi.ch = +selCh.value; salvaMidi(); }); selDev.addEventListener('change', () => { midi.dev = selDev.value; salvaMidi(); ligaEntradas(); });
function setaModo(id, m) { if (estado.v[id] && 'modo' in estado.v[id] && estado.v[id].modo !== m) { estado.v[id].modo = m; manda({ t: 'p', p: { [id]: { modo: m } } }); if (CTL[id + '.modo']) CTL[id + '.modo'].pinta(); pintaPads(); salva(); } }
function recebe(d, canal) {
  const st = d[0] & 0xF0, ch = (d[0] & 0x0F) + 1; if (midi.ch && ch !== midi.ch) return; if (d.length < 3 && st !== 0xC0 && st !== 0xD0) return;
  if (st === 0x90 && d[2] > 0) { const alvo = NOTA_PARA[d[1]]; if (alvo) { if (alvo.length > 1) setaModo(alvo[0], alvo[1]); disparar(alvo[0], midi.vel && d[2] >= midi.limiar, 'nota ' + d[1] + ', velocity ' + d[2] + ', canal ' + ch); } else $('ultimo').textContent = 'nota ' + d[1] + ' sem voz no mapa'; }
  else if (st === 0xB0) {
    if (midi.learn && ctlSel) { midi.map[ctlSel] = { cc: d[1], ch }; salvaMidi(); pintaLearn(); return; }
    for (const id in midi.map) { const m = midi.map[id]; if (m.cc !== d[1] || m.ch !== ch || !CTL[id]) continue; const c = CTL[id], v = d[2] / 127;
      if (c.tipo === 'knob') c.set01(v); else if (c.tipo === 'disc') c.setIdx(Math.min(c.n - 1, Math.floor(v * c.n))); else if (c.tipo === 'botao' && d[2] >= 64) c.press(); }
  }
}
function ligaEntradas() { if (!acessoMidi) return; const ent = [...acessoMidi.inputs.values()]; for (const i of ent) i.onmidimessage = (midi.dev === 'todos' || midi.dev === i.id) ? ev => recebe(ev.data) : null; }
function listaDisp() { if (!acessoMidi) return; const ent = [...acessoMidi.inputs.values()], atual = midi.dev; selDev.innerHTML = ''; selDev.appendChild(Object.assign(el('option', '', 'Todos os dispositivos'), { value: 'todos' })); for (const i of ent) selDev.appendChild(Object.assign(el('option', '', i.name || i.id), { value: i.id })); selDev.value = [...selDev.options].some(o => o.value === atual) ? atual : 'todos'; midi.dev = selDev.value;
  $('midiInfo').textContent = ent.length ? ent.length + ' dispositivo(s) de entrada.' : 'Nenhum dispositivo MIDI conectado.'; ligaEntradas(); }
if (navigator.requestMIDIAccess) navigator.requestMIDIAccess({ sysex: false }).then(a => { acessoMidi = a; a.onstatechange = listaDisp; listaDisp(); }).catch(() => { $('midiInfo').textContent = 'Acesso ao MIDI negado ou indisponível.'; });
else $('midiInfo').textContent = 'Este navegador não oferece Web MIDI (o Safari do iPhone, até onde se sabe, não oferece). Os pads e o teclado funcionam.';
pintaLearn();

/* ---------- exportar, importar, zerar ---------- */
btnExp.addEventListener('click', () => { const blob = new Blob([JSON.stringify({ versao: 1, patterns: twin.seq.exporta(), painel: estado }, null, 1)], { type: 'application/json' }); const a = el('a'); a.href = URL.createObjectURL(blob); a.download = 'patterns-caixa-de-ritmos.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); });

btnZerar.addEventListener('click', () => { if (!confirm('Zerar o painel e apagar todos os patterns? O mapeamento MIDI é mantido.')) return; estado = estado0(); twin.seq.importa(new Motor(48000).seq.exporta()); try { localStorage.setItem(CHAVE + ':estado', JSON.stringify({ e: estado, s: twin.seq.exporta() })); } catch (e) {} location.reload(); });

})();
