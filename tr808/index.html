<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clone do TR-808 (em construção: todas as vozes, sem sequenciador)</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
:root{--pagina:#16181b;--tinta:#e8e6df;--apagado:#9a9890;--painel:#2b2f36;--sulco:#14161a;--acento:#e0662a;--foco:#1f7ae0;
  --f-rot:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--f-texto:"Barlow","Helvetica Neue",Arial,sans-serif;color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--pagina);color:var(--tinta);font-family:var(--f-texto);line-height:1.4}
.wrap{max-width:720px;margin:0 auto;padding:20px 12px 80px}
h1{font-family:var(--f-rot);font-weight:600;letter-spacing:.04em;margin:0 0 4px}
.aviso{color:var(--apagado);font-size:.9rem;margin:0 0 16px}
.painel{background:var(--painel);border-radius:10px;padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
label{display:block;font-family:var(--f-rot);letter-spacing:.06em;text-transform:uppercase;font-size:.95rem}
output{display:block;color:var(--apagado);font-size:.8rem;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;min-height:44px}
button{min-height:44px;min-width:44px;padding:0 18px;border-radius:8px;border:1px solid #555;background:#3a3f48;color:var(--tinta);font:inherit;cursor:pointer}
button.liga[aria-pressed=true]{background:var(--acento);color:#111;border-color:var(--acento)}
.pad{grid-column:1/-1;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pad .bd{flex:1 1 130px;min-height:88px;font-family:var(--f-rot);font-size:1.6rem;letter-spacing:.08em}
:focus-visible{outline:2px solid var(--foco);outline-offset:2px}
#barra{margin:12px 0 0;color:var(--apagado);font-size:.85rem;min-height:1.2em}
</style>
</head>
<body>
<div class="wrap">
<h1>Rhythm Composer, em construção</h1>
<p class="aviso">Etapa 9 de 10: as 16 vozes e o master estão no motor. Faltam o painel final e o sequenciador. Controles e sequenciador completos vêm depois das vozes. Página provisória, ainda fora do menu.</p>
<div class="painel" id="painel"></div>
<p id="barra" role="status"></p>
</div>

<script type="text/plain" id="dsp">
/* Motor de som do clone do TR-808. Roda igual em três lugares: AudioWorklet (página), ScriptProcessor (reserva)
   e Node (tests/medicao/tr808). Por isso não usa nada do navegador. Marcas (a) (b) (c): ver docs/pesquisa/tr808.md.
   VERSÃO 1: bumbo com subida de pitch no ataque, "pitch sigh", TONE, pulso saturado e accent. */
const T_TRIG = 0.001;                    // (a) COMMON TRIG alargado para ~1 ms (p.4)
const V_NORMAL = 4, V_ACC_MAX = 14;      // (a) trigger ~4 V sem accent; até 14 V com accent no máximo (p.4)
const V_POR_UNIDADE = 0.1;               // (c) 1,0 digital = 10 V de pico no mix; só dá folga de cabeça
const GANHO_MIX = { bd: 1.5, sd: 1.0, lt: 1.0, mt: 1.0, ht: 1.0, oh: 0.59, ch: 0.70, cy: 0.70, cb: 0.70, cp: 1.0, ma: 1.0, rs: 1.0 };   // (c, sobre a) R75 33k / R de mistura: BD 22k, OH 56k, CH/CB/CY 47k, demais 33k (Parte C, seção 10)           // (c, sobre a) R75 33k / R5 22k (Parte C, seção 10)
/* Bumbo. f0: decisão do usuário (Werner/amostras). tDecay e Vpp: (a) tabela p.14, critério 1/10 do Vpp. */
const BD = {
  f0: 49.5, tDecay: [0.050, 0.300, 0.800], vppNormal: 3.5, vppAccent: 10,
  riseRatio: 2.81,       // (c sobre a) sqrt((R166+R165)/R166) = sqrt(53,8k/6,8k) com Q43 saturado (Parte B 3.1); o texto da Roland diz "twice", Werner ">1 oitava"
  tRise: 0.004,          // (a) Q43 conduz ~4 ms (p.5)
  tauRise: 0.0015,       // (c) volta do ratio a 1 em ~2 ms depois dos 4 ms (S4: ~6 ms no total); forma sem fonte
  sighSt: 12 * Math.log2(58 / 49.5), tauSigh: 0.1,  // (b) S4 Fig. 11: 48 a 58 Hz nos primeiros 0,3 s (decisão do usuário: segue o Werner); parte de 58 Hz e assenta em f0. (c) τ = 0,1 s: forma sem fonte
  tauClick: 70e-6,       // (c sobre a) R162·C40 = 4,7k × 15 nF
  vk: 15.722, k: 0.47976,   // calibrados contra a tabela p.14 (3,5 e 10 Vpp com TONE e DECAY a 12 h): VK ajusta a razão accent/normal, k o nível
  kClick: 0.07196         // (c) SEM FONTE: o click vale 15 % de k por volt de trigger. Existe só para o accent mudar o timbre (decisão); ajustar de ouvido
};
const RC_TONE = { r171: 220, r172: 10e3, vr5: 10e3, c45: 0.1e-6 };   // (a) Parte B 3.1; S4 Tab. 1: R_eq = R171 + (R172 ∥ VR5)
/** TONE 0 a 1 (horário = mais claro, (c)) -> corte (Hz) do passa-baixas de 1 polo. Lei do potenciômetro C: (c). */
const fcTone = th => { const r = (Math.pow(10, 2 * (1 - th)) - 1) / 99, vr = RC_TONE.vr5 * r, par = vr * RC_TONE.r172 / (vr + RC_TONE.r172 || 1), req = RC_TONE.r171 + par; return 1 / (2 * Math.PI * req * RC_TONE.c45); };
const T20 = (tab, p) => p <= 0.5 ? tab[0] * Math.pow(tab[1] / tab[0], p / 0.5) : tab[1] * Math.pow(tab[2] / tab[1], (p - 0.5) / 0.5);   // (c) interpolação log entre os 3 pontos
/** Amplitude do pulso depois do modelador (D53): saturação suave. (c) forma; VK calibrado contra a tabela. */
const pulsoBd = V => BD.vk * Math.tanh(V / BD.vk);

class Bumbo {
  constructor(fs) { this.fs = fs; this.x = 0; this.y = 0; this.t = 1e9; this.V = V_NORMAL; this.lp = 0; this.ck = 0; this.sinal = 0; }
  trig(V) { this.t = 0; this.V = V; this.A = pulsoBd(V); this.bordaIni = true; this.bordaFim = true; }
  /** p = { level, tone, decay } de 0 a 1. Devolve volts no MULTI OUT. */
  amostra(p) {
    const fs = this.fs, t = this.t, dt = 1 / fs;
    // frequência: f0 com "sigh" × subida do Q43 nos primeiros ms
    const sigh = 1 + (Math.pow(2, BD.sighSt / 12) - 1) * Math.exp(-t / BD.tauSigh);
    const sobe = t < BD.tRise ? BD.riseRatio : 1 + (BD.riseRatio - 1) * Math.exp(-(t - BD.tRise) / BD.tauRise);
    const w = 2 * Math.PI * BD.f0 * sigh * sobe / fs, a = Math.exp(-Math.LN10 / T20(BD.tDecay, p.decay) / fs);
    const c = Math.cos(w), s = Math.sin(w), x = this.x, y = this.y;
    this.x = a * (x * c - y * s); this.y = a * (x * s + y * c);
    if (t < T_TRIG) this.x += BD.k * this.A / (T_TRIG * fs);
    // "click" do pulso: bordas de subida e descida passam pelo TONE (S7); amplitude proporcional ao trigger, sem saturar
    this.ck *= Math.exp(-dt / BD.tauClick);
    if (this.bordaIni) { this.ck += BD.kClick * this.V; this.bordaIni = false; }
    if (this.bordaFim && t >= T_TRIG) { this.ck -= BD.kClick * this.V; this.bordaFim = false; }
    this.t += dt;
    const fc = fcTone(p.tone), g = 1 - Math.exp(-2 * Math.PI * fc / fs);
    this.lp += g * (this.x + this.ck - this.lp);
    return this.lp * p.level * p.level;
  }
}

/** Fonte de ruído compartilhada (uma amostra por passo, como o gerador único do circuito). Ruído branco gaussiano
    aproximado (soma de 4 uniformes), semente fixa para as medições reproduzirem; passa-baixas de 1 polo em 7,23 kHz
    (R130·C202, lote 6 em diante, Parte C seção 4), normalizado para rms 1. O nível de 130 mV em TP-4 não entra: os ganhos
    seguintes não foram lidos, então cada voz tem seu ganho (c). */
const WN_FC = 7230;
const PN_F0 = 273, PN_Q = 0.74;      // (c sobre a) "ruído rosa" = Sallen-Key passa-baixas de 2 polos aplicado ao WN (Parte C, seção 4); não é −3 dB/oitava
class Ruido {
  constructor(fs, semente = 0x1234abcd) { this.u = semente >>> 0; this.y = 0; this.g = 1 - Math.exp(-2 * Math.PI * WN_FC / fs); this.norma = Math.sqrt((2 - this.g) / this.g); this.wn = 0; this.pn = 0; this.z1 = this.z2 = 0;
    const w0 = 2 * Math.PI * PN_F0 / fs, al = Math.sin(w0) / (2 * PN_Q), a0 = 1 + al, cw = Math.cos(w0);   // biquad passa-baixas (RBJ)
    this.b0 = (1 - cw) / 2 / a0; this.b1 = (1 - cw) / a0; this.b2 = this.b0; this.a1 = -2 * cw / a0; this.a2 = (1 - al) / a0; }
  uni() { let u = this.u; u ^= u << 13; u >>>= 0; u ^= u >>> 17; u ^= u << 5; u >>>= 0; this.u = u; return u / 4294967296 - 0.5; }
  tick() { const b = (this.uni() + this.uni() + this.uni() + this.uni()) * Math.sqrt(3); this.y += this.g * (b - this.y); this.wn = this.y * this.norma;
    const o = this.b0 * this.wn + this.z1; this.z1 = this.b1 * this.wn - this.a1 * o + this.z2; this.z2 = this.b2 * this.wn - this.a2 * o; this.pn = o; return this.wn; }
}
/** Caixa. Dois bridged-T excitados pelo pulso (versão revisada: C58 0,056, C61 0,015, R191 10k, R200 zero; decisão do usuário)
    + ruído branco -> VCA (envelope, SNAPPY) -> passa-altas Sallen-Key (f0 2750 Hz, Q 0,73). TONE mistura os dois osciladores. */
const SD = {
  fGrave: 173.3, qGrave: 16.3, fAgudo: 336.0, qAgudo: 9.9,   // (c sobre a) conta da Fig. 11 com os valores lidos (Parte B 3.2); decay vem do Q
  fHp: 2750, qHp: 0.73,                                      // (c sobre a) Sallen-Key, Parte B 3.2
  tNoise: 0.060,                                             // (c) SEM FONTE: decay do envelope do ruído = decay da tabela (60 ms)
  vk: 18.963, k: 0.28922,        // calibrados contra a tabela p.14 (3 e 10 Vpp, TONE e SNAPPY a 12 h): VK ajusta a razão accent/normal, k o nível
  gNoise: 0.25681                // (c) SEM FONTE: com SNAPPY a 12 h e trigger normal, o ruído tem o mesmo rms dos osciladores nos 30 ms iniciais. O ruído usa V sem saturar (c): é o que faz o accent mudar o timbre
};
class Caixa {
  constructor(fs, fonte) {
    this.fs = fs; this.fonte = fonte; this.t = 1e9; this.V = V_NORMAL; this.A = 0; this.xl = this.yl = this.xh = this.yh = 0;
    const w0 = 2 * Math.PI * SD.fHp / fs, al = Math.sin(w0) / (2 * SD.qHp), a0 = 1 + al, cw = Math.cos(w0);   // biquad passa-altas (RBJ)
    this.b0 = (1 + cw) / 2 / a0; this.b1 = -(1 + cw) / a0; this.b2 = this.b0; this.a1 = -2 * cw / a0; this.a2 = (1 - al) / a0; this.z1 = this.z2 = 0;
    this.rl = { w: 2 * Math.PI * SD.fGrave / fs, a: Math.exp(-(2 * Math.PI * SD.fGrave / (2 * SD.qGrave)) / fs) };
    this.rh = { w: 2 * Math.PI * SD.fAgudo / fs, a: Math.exp(-(2 * Math.PI * SD.fAgudo / (2 * SD.qAgudo)) / fs) };
    this.rl.c = Math.cos(this.rl.w); this.rl.s = Math.sin(this.rl.w); this.rh.c = Math.cos(this.rh.w); this.rh.s = Math.sin(this.rh.w);
  }
  trig(V) { this.t = 0; this.V = V; this.A = SD.vk * Math.tanh(V / SD.vk); }   // (c) pulso saturado; ruído usa V sem saturar
  /** p = { level, tone, snappy } de 0 a 1. Devolve volts no MULTI OUT. */
  amostra(p) {
    const fs = this.fs, t = this.t, l = this.rl, h = this.rh;
    let x = this.xl, y = this.yl; this.xl = l.a * (x * l.c - y * l.s); this.yl = l.a * (x * l.s + y * l.c);
    x = this.xh; y = this.yh; this.xh = h.a * (x * h.c - y * h.s); this.yh = h.a * (x * h.s + y * h.c);
    if (t < T_TRIG) { const e = SD.k * this.A / (T_TRIG * fs); this.xl += e; this.xh += e; }
    const env = Math.exp(-t * Math.LN10 / SD.tNoise), n = this.fonte.wn * env * p.snappy * this.V * SD.gNoise;
    const o = this.b0 * n + this.z1; this.z1 = this.b1 * n - this.a1 * o + this.z2; this.z2 = this.b2 * n - this.a2 * o;
    this.t += 1 / fs;
    return ((1 - p.tone) * this.xl + p.tone * this.xh + o) * p.level * p.level;
  }
}

/** Toms e congas: 3 circuitos (LT/LC, MT/MC, HT/HC), cada um com a chave tom/conga que troca a frequência (SW8, C77/R224).
    Frequências, decays e amplitudes: tabela da p.14 (a), três pontos de TUNING, como decidido (não a fórmula bridged-T).
    Bridged-T excitado por pulso; os diodos de germânio (D80/D81) encurtam a constante de tempo logo após o disparo, então o pitch
    começa mais alto e cai (a, p.6). Os toms recebem ruído "rosa" com decay um pouco mais longo (a, p.6; S10: todos os toms). */
const TOM_PULSO = { tom: 0.0001, conga: 0.00003 };   // (c sobre a) largura do pulso que excita o ressonador: o gatilho é diferenciado por C73·R226 (22k × 6,8 nF = 150 µs, LT) ou R224 (1,5k, LC) (Parte B 3.3); ordem de grandeza, não valor exato
const TOM_RUIDO_EXP = 1.5;             // (c) SEM FONTE: o ruído cresce com o trigger^1,5 (VCA do ruído, Q52, expansivo). É o que dá ao MT (tom) 11 Vpp com accent (razão 3,67 > 3,5 dos triggers) e muda o timbre do tom com accent
const TOM_RUIDO_DECAY = 1.3;           // (c) SEM FONTE: o texto diz só "slightly longer"
const TOM_QUEDA = { d: 0.3, tau: 0.025, exp: 0.25 };   // (c) SEM FONTE: queda de pitch em Hz ou cents "não encontrada". Início = f × (1 + d·(A/A_normal)^exp), caindo com τ = 25 ms; maior com accent, pois o diodo conduz com mais sinal (a, p.6); exp = 0,25 foi o maior que ainda deixa o MT chegar perto de 11 Vpp
const TOM = {   // f: Hz em TUNING mín./12 h/máx. (a); T: decay a −20 dB em s (a); vk, k, gN: calibrados contra a tabela (3,5/12; 3/11; 3/10 Vpp); gN do ruído: (c) ver abaixo
  lt: { tom: { f: [80, 90, 100], T: 0.200, vk: 9.67306, k: 0.42293, gN: 0.399472 }, conga: { f: [165, 185, 220], T: 0.180, vk: 52.1538, k: 0.444257, gN: 0 } },
  mt: { tom: { f: [120, 135, 160], T: 0.130, vk: 1e9, k: 0.376489, gN: 0.301175 }, conga: { f: [250, 280, 310], T: 0.100, vk: 33.9543, k: 0.382723, gN: 0 } },
  ht: { tom: { f: [165, 185, 220], T: 0.100, vk: 7.95204, k: 0.454598, gN: 0.447879 }, conga: { f: [370, 400, 455], T: 0.080, vk: 52.2124, k: 0.444466, gN: 0 } },   // HT = LC: está impresso assim na tabela
};
/** TUNING 0 a 1 (horário = mais agudo, (c)) -> Hz. Interpolação log-linear entre os três pontos da tabela (c): a lei do pot. não foi encontrada. */
const fTom = (f, th) => th <= 0.5 ? f[0] * Math.pow(f[1] / f[0], th / 0.5) : f[1] * Math.pow(f[2] / f[1], (th - 0.5) / 0.5);
class Tom {
  constructor(fs, fonte, circ) { this.fs = fs; this.fonte = fonte; this.circ = circ; this.ti = 1e9; this.x = 0; this.y = 0; this.t = 1e9; this.V = V_NORMAL; this.A = 0; this.d = 0; }
  trig(V) { this.t = 0; this.V = V; this.pend = true; this.ti = 0; }   // A e a queda de pitch dependem da chave tom/conga, lida no 1º passo
  /** p = { level, tuning, modo } (modo 0 = tom, 1 = conga). Devolve volts no MULTI OUT. */
  amostra(p) {
    const fs = this.fs, t = this.t, e = TOM[this.circ][p.modo ? 'conga' : 'tom']; this.ent = e;
    if (this.pend) { this.pend = false; this.A = e.vk * Math.tanh(this.V / e.vk); this.d = TOM_QUEDA.d * Math.pow(this.A / (e.vk * Math.tanh(V_NORMAL / e.vk)), TOM_QUEDA.exp); }
    const w = 2 * Math.PI * fTom(e.f, p.tuning) * (1 + this.d * Math.exp(-t / TOM_QUEDA.tau)) / fs, a = Math.exp(-Math.LN10 / e.T / fs);
    const c = Math.cos(w), s = Math.sin(w), x = this.x, y = this.y;
    this.x = a * (x * c - y * s); this.y = a * (x * s + y * c);
    const np = Math.max(1, Math.round(TOM_PULSO[p.modo ? 'conga' : 'tom'] * fs)); if (this.ti < np) { this.x += e.k * this.A / np; this.ti++; }
    let n = 0; if (e.gN) n = this.fonte.pn * Math.exp(-t * Math.LN10 / (TOM_RUIDO_DECAY * e.T)) * V_NORMAL * Math.pow(this.V / V_NORMAL, TOM_RUIDO_EXP) * e.gN;
    this.t += 1 / fs;
    return (this.x + n) * p.level * p.level;
  }
}

/* ===== Metais: seis quadradas, passa-bandas do IC3, prato, hi-hats ===== */
const METAL = {
  osc: [205.4, 304.4, 369.6, 522.7, 800, 540],   // (a/c) Parte C, seção 2. Os dois últimos são os do cowbell nos ajustes de fábrica (TM2 = 800 Hz, TM1 = 540 Hz)
  duty: 0.4798,                                  // (b) Werner: 47,98 % a 5 V
  bpAlto: { f: 7117, q: 6.05, hp: 7234 },        // (c sobre a) IC3 pino 7; acoplamento C11 1 nF + R55 22k = 7,23 kHz
  bpBaixo: { f: 3454, q: 6.05, hp: 1462 },       // (c sobre a) IC3 pino 1; C10 3,3 nF + R52 33k = 1,46 kHz
  tAtaque: 102.44e-6,                            // (b) Werner: "attack smoother" de 1 polo
  sigAlto: 0.0205, sigBaixo: 0.039                // (c) "swing-type VCA": saturação suave tanh; sat em desvios-padrão do sinal. sig*: rms do sinal na entrada dos VCAs (medido)
};
const MET_TRIG = v => 7 + (v - V_NORMAL) * (14 - 7) / (V_ACC_MAX - V_NORMAL);   // (a) IC2 estreita o trigger dos metais para 7 a 14 V; (c) mapa linear
/* Seções de 1ª e 2ª ordem por transformada bilinear. mkBP/mkHP: biquads RBJ (passa-banda de ganho 0 dB no pico; passa-altas de ganho 1 em HF, igual ao Sallen-Key). */
const mkBiq = (b0, b1, b2, a1, a2) => ({ b0, b1, b2, a1, a2, z1: 0, z2: 0, process(x) { const y = this.b0 * x + this.z1; this.z1 = this.b1 * x - this.a1 * y + this.z2; this.z2 = this.b2 * x - this.a2 * y; return y; } });
/** Passa-banda: o Q é compensado para que a largura a −3 dB digital seja a analógica f0/Q (a bilinear comprime a banda perto de Nyquist). */
const mkBP = (f0, q, fs) => {
  const tw = Math.tan(Math.PI * f0 / fs), bw = qd => { const r = Math.sqrt(1 / (qd * qd) + 4), f = o => fs / Math.PI * Math.atan(o * tw); return f((1 / qd + r) / 2) - f((-1 / qd + r) / 2); };
  let lo = q * 0.4, hi = q * 4; for (let i = 0; i < 50; i++) { const m = Math.sqrt(lo * hi); if (bw(m) > f0 / q) lo = m; else hi = m; }
  const qd = Math.sqrt(lo * hi), w = 2 * Math.PI * f0 / fs, al = Math.sin(w) / (2 * qd), a0 = 1 + al; return mkBiq(al / a0, 0, -al / a0, -2 * Math.cos(w) / a0, (1 - al) / a0);
};
const mkHP = (f0, q, fs, k = 1) => { const w = 2 * Math.PI * f0 / fs, al = Math.sin(w) / (2 * q), a0 = 1 + al, c = Math.cos(w); return mkBiq(k * (1 + c) / 2 / a0, -k * (1 + c) / a0, k * (1 + c) / 2 / a0, -2 * c / a0, (1 - al) / a0); };
/** Seção de 1ª ordem H(s) = (n1·s + n0)/(d1·s + 1) por bilinear. */
class Sec1 {
  constructor(fs) { this.fs = fs; this.x1 = 0; this.y1 = 0; this.b0 = 0; this.b1 = 0; this.a1 = 0; }
  /** fp: frequência (Hz) em que a bilinear é pré-distorcida (a do polo ou do corte). */
  set(n0, n1, d1, fp) { const f = Math.min(fp, 0.45 * this.fs), a = 2 * Math.PI * f / Math.tan(Math.PI * f / this.fs), den = 1 + a * d1; this.b0 = (n0 + a * n1) / den; this.b1 = (n0 - a * n1) / den; this.a1 = (1 - a * d1) / den; return this; }
  process(x) { const y = this.b0 * x + this.b1 * this.x1 - this.a1 * this.y1; this.x1 = x; this.y1 = y; return y; }
}
class Hp1 extends Sec1 { constructor(fc, fs) { super(fs); const t = 1 / (2 * Math.PI * fc); this.set(0, t, t, fc); } }
const RF = th => { const rv = 100e3 * th * th, par = rv * 470e3 / (rv + 470e3 || 1); return th <= 0 ? 0 : par; };   // (a) realimentação do estágio de nível: 470k ∥ VR (100k A, taper (c) = θ²); no máximo 82,5k

/** Cowbell: os dois quadrados do TM1 (540 Hz) e TM2 (800 Hz) da fonte metálica, cada um com seu VCA (Q15, Q14), um só envelope,

      lt: { level: 1, tuning: 0.5, modo: 0 }, mt: { level: 1, tuning: 0.5, modo: 0 }, ht: { level: 1, tuning: 0.5, modo: 0 },
      cy: { level: 1, tone: 0.5, decay: 0.5 }, oh: { level: 1, decay: 0.5 }, ch: { level: 1 }, cb: { level: 1 }, cp: { level: 1, modo: 0 }, rs: { level: 1, modo: 0 } }; this.p.ma = this.p.cp;   // o par MA/CP tem um LEVEL e uma chave só
    this.fonte = new Ruido(fs); this.bd = new Bumbo(fs); this.sd = new Caixa(fs, this.fonte);
    for (const c of ['lt', 'mt', 'ht']) this[c] = new Tom(fs, this.fonte, c);
    this.metal = new Metal(fs); this.cy = new Prato(fs, this.metal); this.oh = new Hat(fs, this.metal, 'oh'); this.ch = new Hat(fs, this.metal, 'ch'); this.cb = new Cowbell(fs, this.metal); this.cp = new Clap(fs, this.fonte); this.ma = new Maracas(fs, this.fonte); this.rs = new RimClaves(fs); this.master = new Master(fs); this.saida = null;
  }
  msg(m) {
    if (m.t === 'p') { const q = m.p; for (const v of ['bd', 'sd', 'lt', 'mt', 'ht', 'cy', 'oh', 'ch', 'cb', 'cp', 'ma', 'rs']) if (q[v]) Object.assign(this.p[v], q[v]); for (const k of ['acLevel', 'master', 'on', 'saida']) if (k in q) this.p[k] = q[k]; }
    else if (m.t === 'trig' && (m.v === 'cp' || m.v === 'ma')) (this.p.cp.modo === 1 ? this.ma : this.cp).trig(m.ac ? V_NORMAL + (V_ACC_MAX - V_NORMAL) * this.p.acLevel : V_NORMAL);   // a chave MA/CP escolhe a voz
    else if (m.t === 'trig' && this[m.v] && this[m.v].trig) { if (m.v === 'ch') this.oh.choke(); this[m.v].trig(m.ac ? V_NORMAL + (V_ACC_MAX - V_NORMAL) * this.p.acLevel : V_NORMAL); }
  }
  /** Soma das vozes em volts, já com o ganho do resistor de mistura. */
  tick() { this.fonte.tick(); this.metal.tick(); }
  mixVolts() { return this.bd.amostra(this.p.bd) * GANHO_MIX.bd + this.sd.amostra(this.p.sd) * GANHO_MIX.sd
    + this.lt.amostra(this.p.lt) * GANHO_MIX.lt + this.mt.amostra(this.p.mt) * GANHO_MIX.mt + this.ht.amostra(this.p.ht) * GANHO_MIX.ht
    + this.cy.amostra(this.p.cy) * GANHO_MIX.cy + this.oh.amostra(this.p.oh) * GANHO_MIX.oh + this.ch.amostra(this.p.ch) * GANHO_MIX.ch + this.cb.amostra(this.p.cb) * GANHO_MIX.cb + this.cp.amostra(this.p.cp) * GANHO_MIX.cp + this.ma.amostra(this.p.ma) * GANHO_MIX.ma + this.rs.amostra(this.p.rs) * GANHO_MIX.rs; }
  /** L e R recebem a mesma saída mono: HI (padrão) ou LO (p.saida = 1). p.on = 0 desliga (POWER: o muting por Q13). */
  process(L, R, n) {
    const lo = this.p.saida === 1, mudo = this.p.on === 0;
    for (let i = 0; i < n; i++) { this.tick(); const y = this.master.processa(this.mixVolts(), this.p.master, lo), v = mudo ? 0 : y; L[i] = v; R[i] = v; }
  }
}
Motor.dados = { T_TRIG, V_NORMAL, V_ACC_MAX, V_POR_UNIDADE, BD, GANHO_MIX, T20, fcTone, pulsoBd, RC_TONE, Bumbo, SD, Caixa, Ruido, TOM, TOM_RUIDO_DECAY, TOM_QUEDA, Tom, fTom, TOM_PULSO, TOM_RUIDO_EXP, METAL, Metal, CY, HAT, Prato, Hat, mkBP, mkHP, Hp1, MET_TRIG, T_DECAY, CB, Cowbell, CP, Clap, RS, RimClaves, MA, Maracas, MASTER, Master, mkMasterPolos };

if (typeof AudioWorkletProcessor !== 'undefined' && typeof registerProcessor === 'function') {
  registerProcessor('motor-tr808', class extends AudioWorkletProcessor {
    constructor() { super(); this.m = new Motor(sampleRate); this.port.onmessage = e => this.m.msg(e.data); }
    process(_, saidas) { const o = saidas[0]; if (!o || !o[0]) return true; this.m.process(o[0], o[1] || o[0], o[0].length); return true; }
  });
}

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const FONTE_DSP = $('dsp').textContent;
const Motor = new Function(FONTE_DSP + '\nreturn Motor;')();
const estado = { acLevel: 1, master: 0.8, bd: { level: 0.85, tone: 0.5, decay: 0.5 }, sd: { level: 0.85, tone: 0.5, snappy: 0.5 }, lt: { level: 0.85, tuning: 0.5, modo: 0 }, mt: { level: 0.85, tuning: 0.5, modo: 0 }, ht: { level: 0.85, tuning: 0.5, modo: 0 }, cy: { level: 0.85, tone: 0.5, decay: 0.5 }, oh: { level: 0.85, decay: 0.5 }, ch: { level: 0.85 }, cb: { level: 0.85 }, cp: { level: 0.85, modo: 0 }, rs: { level: 0.85, modo: 0 }, on: 1, saida: 0, acc: false };
const CHAVE = 'sint-tr808-v1:estado';
try { const s = JSON.parse(localStorage.getItem(CHAVE) || 'null'); if (s) { Object.assign(estado, s); estado.bd = Object.assign({ level: 0.85, tone: 0.5, decay: 0.5 }, s.bd); estado.sd = Object.assign({ level: 0.85, tone: 0.5, snappy: 0.5 }, s.sd); for (const c of ['lt', 'mt', 'ht']) estado[c] = Object.assign({ level: 0.85, tuning: 0.5, modo: 0 }, s[c]); estado.cy = Object.assign({ level: 0.85, tone: 0.5, decay: 0.5 }, s.cy); estado.oh = Object.assign({ level: 0.85, decay: 0.5 }, s.oh); estado.ch = Object.assign({ level: 0.85 }, s.ch); estado.cb = Object.assign({ level: 0.85 }, s.cb); estado.cp = Object.assign({ level: 0.85, modo: 0 }, s.cp); estado.rs = Object.assign({ level: 0.85, modo: 0 }, s.rs); estado.on = s.on === 0 ? 0 : 1; estado.saida = s.saida === 1 ? 1 : 0; } } catch (e) {}
const salva = () => { try { localStorage.setItem(CHAVE, JSON.stringify(estado)); } catch (e) {} };
let ctx = null, no = null, reserva = null, pronto = false; const pend = [];
const manda = m => { if (!pronto) { pend.push(m); return; } if (no) no.port.postMessage(m); else if (reserva) reserva.motor.msg(m); };
const diz = t => { $('barra').textContent = t; };
function liga() {
  if (ctx) { if (ctx.state !== 'running') ctx.resume().catch(() => {}); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) { diz('Este navegador não tem Web Audio.'); return; }
  ctx = new AC({ latencyHint: 'interactive' });
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  const fim = () => { pronto = true; manda({ t: 'p', p: estado }); for (const m of pend.splice(0)) manda(m); };
  const usaReserva = () => { const sp = ctx.createScriptProcessor(1024, 0, 2); sp.motor = new Motor(ctx.sampleRate);
    sp.onaudioprocess = e => { const o = e.outputBuffer; sp.motor.process(o.getChannelData(0), o.getChannelData(1), o.length); }; sp.connect(ctx.destination); reserva = sp; fim(); };
  if (ctx.audioWorklet && window.AudioWorkletNode) {
    const url = URL.createObjectURL(new Blob([FONTE_DSP], { type: 'application/javascript' }));
    const dataUrl = () => 'data:application/javascript;base64,' + btoa(unescape(encodeURIComponent(FONTE_DSP)));
    ctx.audioWorklet.addModule(url).catch(() => ctx.audioWorklet.addModule(dataUrl())).then(() => {
      no = new AudioWorkletNode(ctx, 'motor-tr808', { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2] });
      no.connect(ctx.destination); URL.revokeObjectURL(url); fim();
    }).catch(usaReserva);
  } else usaReserva();
  ctx.resume().catch(() => {});
}
for (const ev of ['touchend', 'pointerup', 'click', 'keydown']) document.addEventListener(ev, () => { if (!ctx || ctx.state !== 'running') liga(); }, { capture: true, passive: true });

const P = $('painel');
function knob(nome, get, set) {
  const d = document.createElement('div'), id = 'k' + Math.random().toString(36).slice(2, 7);
  d.innerHTML = `<label for="${id}">${nome}</label><input id="${id}" type="range" min="0" max="1" step="0.001"><output></output>`;
  const r = d.querySelector('input'), o = d.querySelector('output'); r.value = get(); o.textContent = Math.round(get() * 100) + ' %';
  r.addEventListener('input', () => { set(+r.value); o.textContent = Math.round(+r.value * 100) + ' %'; salva(); });
  P.appendChild(d);
}
knob('BD level', () => estado.bd.level, v => { estado.bd.level = v; manda({ t: 'p', p: { bd: { level: v } } }); });
knob('BD tone', () => estado.bd.tone, v => { estado.bd.tone = v; manda({ t: 'p', p: { bd: { tone: v } } }); });
knob('BD decay', () => estado.bd.decay, v => { estado.bd.decay = v; manda({ t: 'p', p: { bd: { decay: v } } }); });
knob('SD level', () => estado.sd.level, v => { estado.sd.level = v; manda({ t: 'p', p: { sd: { level: v } } }); });
knob('SD tone', () => estado.sd.tone, v => { estado.sd.tone = v; manda({ t: 'p', p: { sd: { tone: v } } }); });
knob('SD snappy', () => estado.sd.snappy, v => { estado.sd.snappy = v; manda({ t: 'p', p: { sd: { snappy: v } } }); });
for (const [c, nome] of [['lt', 'LT/LC'], ['mt', 'MT/MC'], ['ht', 'HT/HC']]) {
  knob(nome + ' level', () => estado[c].level, v => { estado[c].level = v; manda({ t: 'p', p: { [c]: { level: v } } }); });
  knob(nome + ' tuning', () => estado[c].tuning, v => { estado[c].tuning = v; manda({ t: 'p', p: { [c]: { tuning: v } } }); });
  const ch = document.createElement('div'); ch.innerHTML = `<label>${nome} chave</label><button class="liga" type="button" aria-pressed="${!!estado[c].modo}"></button>`;
  const b = ch.querySelector('button'), pinta = () => { b.textContent = estado[c].modo ? 'Conga' : 'Tom'; b.setAttribute('aria-pressed', String(!!estado[c].modo)); };
  pinta(); b.addEventListener('click', () => { estado[c].modo = estado[c].modo ? 0 : 1; pinta(); manda({ t: 'p', p: { [c]: { modo: estado[c].modo } } }); salva(); }); P.appendChild(ch);
}
knob('CY level', () => estado.cy.level, v => { estado.cy.level = v; manda({ t: 'p', p: { cy: { level: v } } }); });
knob('CY tone', () => estado.cy.tone, v => { estado.cy.tone = v; manda({ t: 'p', p: { cy: { tone: v } } }); });
knob('CY decay', () => estado.cy.decay, v => { estado.cy.decay = v; manda({ t: 'p', p: { cy: { decay: v } } }); });
knob('OH level', () => estado.oh.level, v => { estado.oh.level = v; manda({ t: 'p', p: { oh: { level: v } } }); });
knob('OH decay', () => estado.oh.decay, v => { estado.oh.decay = v; manda({ t: 'p', p: { oh: { decay: v } } }); });
knob('CH level', () => estado.ch.level, v => { estado.ch.level = v; manda({ t: 'p', p: { ch: { level: v } } }); });
knob('CB level', () => estado.cb.level, v => { estado.cb.level = v; manda({ t: 'p', p: { cb: { level: v } } }); });
knob('CP/MA level', () => estado.cp.level, v => { estado.cp.level = v; manda({ t: 'p', p: { cp: { level: v } } }); });
{ const ch = document.createElement('div'); ch.innerHTML = '<label>CP/MA chave</label><button class="liga" type="button"></button>';
  const b = ch.querySelector('button'), pinta = () => { b.textContent = estado.cp.modo ? 'Maracas' : 'Hand clap'; b.setAttribute('aria-pressed', String(!!estado.cp.modo)); };
  pinta(); b.addEventListener('click', () => { estado.cp.modo = estado.cp.modo ? 0 : 1; pinta(); manda({ t: 'p', p: { cp: { modo: estado.cp.modo } } }); salva(); }); P.appendChild(ch); }
knob('RS/CL level', () => estado.rs.level, v => { estado.rs.level = v; manda({ t: 'p', p: { rs: { level: v } } }); });
{ const ch = document.createElement('div'); ch.innerHTML = '<label>RS/CL chave</label><button class="liga" type="button"></button>';
  const b = ch.querySelector('button'), pinta = () => { b.textContent = estado.rs.modo ? 'Claves' : 'Rim shot'; b.setAttribute('aria-pressed', String(!!estado.rs.modo)); };
  pinta(); b.addEventListener('click', () => { estado.rs.modo = estado.rs.modo ? 0 : 1; pinta(); manda({ t: 'p', p: { rs: { modo: estado.rs.modo } } }); salva(); }); P.appendChild(ch); }
knob('Accent level', () => estado.acLevel, v => { estado.acLevel = v; manda({ t: 'p', p: { acLevel: v } }); });
{ const ch = document.createElement('div'); ch.innerHTML = '<label>Power / saída</label><button class="liga" id="pw" type="button"></button> <button class="liga" id="so" type="button"></button>';
  const pw = ch.querySelector('#pw'), so = ch.querySelector('#so'), pinta = () => { pw.textContent = estado.on ? 'On' : 'Off'; pw.setAttribute('aria-pressed', String(!!estado.on)); so.textContent = estado.saida ? 'LO (−19 dB)' : 'HI'; so.setAttribute('aria-pressed', String(!!estado.saida)); };
  pinta(); pw.addEventListener('click', () => { estado.on = estado.on ? 0 : 1; pinta(); manda({ t: 'p', p: { on: estado.on } }); salva(); });
  so.addEventListener('click', () => { estado.saida = estado.saida ? 0 : 1; pinta(); manda({ t: 'p', p: { saida: estado.saida } }); salva(); }); P.appendChild(ch); }
knob('Master volume', () => estado.master, v => { estado.master = v; manda({ t: 'p', p: { master: v } }); });
const pad = document.createElement('div'); pad.className = 'pad';
pad.innerHTML = '<button class="bd" id="bd" type="button">BASS DRUM</button><button class="bd" id="sd" type="button">SNARE DRUM</button><button class="bd" id="lt" type="button">LOW TOM/CONGA</button><button class="bd" id="mt" type="button">MID TOM/CONGA</button><button class="bd" id="ht" type="button">HI TOM/CONGA</button><button class="bd" id="cy" type="button">CYMBAL</button><button class="bd" id="oh" type="button">OPEN HI-HAT</button><button class="bd" id="ch" type="button">CLOSED HI-HAT</button><button class="bd" id="cb" type="button">COW BELL</button><button class="bd" id="cp" type="button">HAND CLAP / MARACAS</button><button class="bd" id="rs" type="button">RIM SHOT / CLAVES</button><button class="liga" id="acc" type="button" aria-pressed="false">Accent</button>';
P.appendChild(pad);
const acc = $('acc'); acc.setAttribute('aria-pressed', String(!!estado.acc));
acc.addEventListener('click', () => { estado.acc = !estado.acc; acc.setAttribute('aria-pressed', String(estado.acc)); salva(); });
const dispara = v => { liga(); manda({ t: 'trig', v, ac: estado.acc }); };
for (const [id, tecla] of [['bd', 'b'], ['sd', 's'], ['lt', 'l'], ['mt', 'm'], ['ht', 'h'], ['cy', 'y'], ['oh', 'o'], ['ch', 'c'], ['cb', 'k'], ['cp', 'p'], ['rs', 'r']]) {
  $(id).addEventListener('pointerdown', e => { e.preventDefault(); dispara(id); });
  $(id).addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); dispara(id); } });
  document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT' || e.repeat) return; if (e.key === tecla) dispara(id); });
}
diz('Teclas: B bumbo, S caixa, L/M/H toms e congas (a chave de cada par escolhe tom ou conga), Y prato, O hi-hat aberto, C hi-hat fechado (corta o aberto), K cowbell, P clap ou maracas (pela chave), R rim shot ou claves (pela chave). O som liga no primeiro toque.');
})();
