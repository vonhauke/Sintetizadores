<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Clone do SH-101</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
/* Layout: como no aparelho. Em cima, o painel de seções com faders (Modulator, VCO, Source Mixer, VCF, VCA, Env);
   no meio, a fileira de teclas com LED e o nome do modelo; embaixo, o controlador à esquerda e o teclado. */
:root{
  --page:#17181a; --ink:#e4e6e8; --muted:#a3a9af;
  --body:#4b4e4a; --body-hi:#585b57; --body-lo:#3d403c; --edge:#262826;
  --band:#6d716c; --line:#2c2e2b; --label:#f0f0ea; --sub:#c2c5bd;
  --slot:#0d0e0d; --tick:#b9bcb4;
  --cap:#3a3c39; --cap-hi:#5a5d59; --stripe:#f08a1c; --stripe-alt:#58c24a;
  --knob:#161716; --knob-edge:#050505; --mark:#f08a1c;
  --keycap:#e9e6da; --keycap-lo:#b9b6a9;
  --led:#ff4433; --led-off:#4a1a15; --focus:#ffcf4a;
  --key-w:#f4f4f0; --key-w-down:#c9cdc6; --key-b:#161716; --key-b-down:#4d514c; --key-edge:#8f928c;
  --font-label:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --font-mark:"Michroma","Eurostile","Arial Black",Arial,sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;color:var(--ink);font-family:var(--font-body);line-height:1.5;-webkit-font-smoothing:antialiased;
  background:radial-gradient(120% 70% at 50% 0%,#33363a 0%,var(--page) 60%,#0f1011 100%) fixed var(--page)}
.wrap{max-width:1340px;margin:0 auto;padding-block:28px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
header p{margin:0 0 1.5rem;max-width:64ch;color:var(--muted)}
button{touch-action:manipulation}

.audio-bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:100;display:block;margin:0;padding:.9rem 1rem;border-radius:10px;border:0;box-shadow:0 6px 20px rgba(0,0,0,.35);background:var(--stripe);color:#241703;font-family:var(--font-label);font-weight:600;font-size:1.05rem;cursor:pointer}
.audio-bar[hidden]{display:none}

/* ---------- gabinete ---------- */
.machine{color:var(--label);border-radius:9px;overflow:hidden;
  background:linear-gradient(180deg,var(--body-hi),var(--body) 30%,var(--body-lo));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22), inset 0 0 0 1px rgba(0,0,0,.5),
    0 3px 0 var(--edge), 0 7px 1px #0a0a0a, 0 16px 14px rgba(0,0,0,.5), 0 44px 60px -12px rgba(0,0,0,.7)}

/* painel de seções */
.secs{display:flex;flex-wrap:wrap;border-bottom:2px solid var(--line)}
.sec{flex:1 1 auto;display:flex;flex-direction:column;border-right:2px solid var(--line);border-bottom:2px solid var(--line);margin-bottom:-2px}
.sec:last-child{border-right:0}
.sec h2{font-family:var(--font-label);font-weight:700;font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;color:var(--label);
  margin:0;padding:5px 10px 4px;line-height:1.2;text-align:center;background:var(--band);border-bottom:2px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.row{display:flex;gap:4px;align-items:flex-start;justify-content:center;padding:10px 8px 12px}

.ctl{display:flex;flex-direction:column;align-items:center;width:42px}
.ctl.wide{width:74px}
.ctl-label{order:-1;font-family:var(--font-label);font-weight:600;font-size:.84rem;letter-spacing:.04em;text-transform:uppercase;line-height:1.1;margin-bottom:6px;text-align:center;white-space:nowrap}
.ctl-val{font-family:var(--font-label);font-weight:500;font-size:.74rem;color:var(--sub);font-variant-numeric:tabular-nums;min-height:1.15em;white-space:nowrap;margin-top:4px}

/* faders: fenda preta, escala branca e capa escura com risco colorido */
.fader{position:relative;width:34px;height:124px;cursor:ns-resize;touch-action:none;outline:none}
.fader .scale{position:absolute;left:0;right:0;top:8px;bottom:8px;
  background:linear-gradient(var(--tick) 1px,transparent 1px) 0 0/100% 10%;border-bottom:1px solid var(--tick);
  -webkit-mask:linear-gradient(90deg,#000 0 8px,transparent 8px calc(100% - 8px),#000 calc(100% - 8px));mask:linear-gradient(90deg,#000 0 8px,transparent 8px calc(100% - 8px),#000 calc(100% - 8px))}
.fader .track{position:absolute;left:50%;top:2px;bottom:2px;width:10px;margin-left:-5px;background:var(--slot);border-radius:2px;box-shadow:inset 0 2px 3px #000, 0 1px 0 rgba(255,255,255,.18)}
.fader .cap{position:absolute;left:5px;width:24px;height:16px;bottom:calc(var(--v) * (100% - 16px));border-radius:2px;
  background:linear-gradient(180deg,var(--cap-hi),var(--cap) 40%,#262826);
  box-shadow:0 0 0 1px #0b0b0b, 0 3px 4px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.25)}
.fader .cap::after{content:"";position:absolute;left:2px;right:2px;top:7px;height:2.5px;background:var(--stripe);border-radius:1px}
#s-mod .cap::after,#s-mix .cap::after,#s-bend .cap::after{background:var(--stripe-alt)}
.fader:focus-visible .cap{outline:3px solid var(--focus);outline-offset:1px}

/* knobs pretos com risco laranja */
.knob{width:58px;height:58px;cursor:ns-resize;touch-action:none;border-radius:50%;outline:none}
.knob svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 4px 3px rgba(0,0,0,.5))}
.k-ticks line{stroke:var(--tick);stroke-width:1.5}
.k-skirt{fill:var(--knob-edge)}
.k-cap{fill:var(--knob);stroke:#3a3c39;stroke-width:1}
.k-mark{stroke:var(--mark);stroke-width:3;stroke-linecap:butt}
.knob:focus-visible{box-shadow:0 0 0 3px var(--focus)}

/* chaves deslizantes: a fenda corre à esquerda das legendas e o cursor para na opção escolhida */
.sw-wrap{display:flex;flex-direction:column;align-items:flex-start}
.sw-wrap .ctl-label{text-align:left;padding-left:2px}
.sw{display:flex;flex-direction:column}
.sw button{position:relative;display:flex;align-items:center;gap:7px;background:transparent;border:0;color:var(--sub);font-family:var(--font-label);font-weight:600;font-size:.8rem;letter-spacing:.03em;text-transform:uppercase;
  padding:0 5px 0 0;min-height:24px;cursor:pointer;white-space:nowrap;line-height:1.1}
.sw button::before{content:"";align-self:stretch;width:14px;flex:none;background:var(--slot);box-shadow:inset 2px 0 2px #000, 1px 0 0 rgba(255,255,255,.15)}
.sw button:first-child::before{border-radius:3px 3px 0 0}
.sw button:last-child::before{border-radius:0 0 3px 3px}
.sw button[aria-checked="true"]{color:var(--label)}
.sw button[aria-checked="true"]::before{
  background:linear-gradient(180deg,transparent 0 3px,#8b8e88 3px 4px,#56595a 4px 9px,#d9dad4 9px 11px,#56595a 11px calc(100% - 4px),#2a2c2a calc(100% - 4px) calc(100% - 3px),transparent calc(100% - 3px)) var(--slot)}
.sw button svg{width:20px;height:12px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.sw button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}

/* ---------- fileira de teclas com LED ---------- */
.mid{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 30px;padding:12px 18px 14px;border-bottom:2px solid var(--line);background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,0))}
.cluster{display:flex;align-items:flex-end;gap:12px}
.group{display:flex;flex-direction:column;gap:5px}
.cluster-title{order:2;font-family:var(--font-label);font-weight:600;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--label);margin:0;padding-top:3px;border-top:1.5px solid var(--sub);text-align:center}
.pbtn,#c-arp .sw button{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:50px;padding:0;min-height:0;background:none;border:0;cursor:pointer;
  color:var(--label);font-family:var(--font-label);font-weight:600;font-size:.76rem;letter-spacing:.05em;text-transform:uppercase;line-height:1.1;white-space:nowrap}
.pbtn::before,#c-arp .sw button::before{content:"";order:-2;align-self:center;width:8px;height:8px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 38% 30%,#a8554a,var(--led-off) 55%,#2a0906);box-shadow:0 0 0 1.5px #0b0b0b}
.pbtn::after,#c-arp .sw button::after{content:"";order:-1;width:40px;height:22px;border-radius:2px;
  background:linear-gradient(180deg,#fbf9ef,var(--keycap) 45%,var(--keycap-lo));
  box-shadow:inset 0 1px 0 #fff, inset 0 -3px 0 rgba(0,0,0,.18), 0 0 0 2px #0b0b0b, 0 4px 3px 1px rgba(0,0,0,.45)}
.pbtn:active::after,#c-arp .sw button:active::after{transform:translateY(1px)}
.pbtn[aria-pressed="true"]::before,#c-arp .sw button[aria-checked="true"]::before{
  background:radial-gradient(circle at 38% 30%,#fff,#ffb09c 22%,var(--led) 58%,#a81d0c);
  box-shadow:0 0 0 1.5px #0b0b0b, 0 0 8px 3px var(--led), 0 0 18px 5px rgba(255,70,40,.4)}
.pbtn.plain::before{visibility:hidden}
.pbtn:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.pbtn:disabled{opacity:.45;cursor:default}
#c-arp .sw{flex-direction:row;gap:12px}
.btn-row{display:flex;gap:12px}
.seqinfo{font-family:var(--font-label);font-size:.85rem;color:var(--sub);min-height:1.3em;flex-basis:100%;order:9}
.clock{width:8px;height:8px;border-radius:50%;background:var(--led-off);display:inline-block;margin-left:6px;vertical-align:middle;box-shadow:0 0 0 1.5px #0b0b0b}
.clock.on{background:var(--led);box-shadow:0 0 0 1.5px #0b0b0b,0 0 6px 2px var(--led)}
.plate{margin-left:auto;align-self:center;font-family:var(--font-mark);font-size:clamp(2rem,5.2vw,3.6rem);line-height:1;letter-spacing:.02em;white-space:nowrap;
  color:transparent;background:repeating-linear-gradient(180deg,var(--label) 0 3px,transparent 3px 5px);-webkit-background-clip:text;background-clip:text}

/* ---------- controlador e teclado ---------- */
.bottom{display:flex;align-items:stretch;gap:0}
.side{flex:none;display:flex;flex-direction:column;gap:12px;padding:14px 16px 16px;border-right:2px solid var(--line)}
.side .cluster{align-items:flex-start;gap:8px}
.side #s-bend{padding:0;gap:6px}
.side .bend-row{display:flex;gap:14px;align-items:flex-end}
.bender{position:relative;width:150px;height:30px;border-radius:4px;background:var(--slot);touch-action:none;cursor:ew-resize;outline:none;box-shadow:inset 0 2px 4px #000, 0 1px 0 rgba(255,255,255,.18)}
.bender .lever{position:absolute;top:-4px;left:calc(50% - 16px + var(--b) * (50% - 19px));width:32px;height:38px;border-radius:3px;
  background:linear-gradient(90deg,#262826,var(--cap-hi) 30%,var(--cap) 70%,#1c1e1c);box-shadow:0 0 0 1px #0b0b0b, 0 4px 4px rgba(0,0,0,.55);transition:left .14s ease-out}
.bender.drag .lever{transition:none}
.bender:focus-visible{box-shadow:0 0 0 3px var(--focus)}
.bend-label{font-family:var(--font-label);font-weight:600;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;text-align:center;margin-top:4px}
.kb-wrap{flex:1;min-width:0;overflow-x:auto;padding:14px 16px 16px;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.05))}
.kb{position:relative;display:flex;height:200px;min-width:640px;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none;border-top:5px solid #0b0b0b;box-shadow:0 6px 8px rgba(0,0,0,.45)}
.key{cursor:pointer}
.key.w{flex:1;background:linear-gradient(180deg,#dcdcd6,var(--key-w) 12%,var(--key-w) 88%,#d5d5cf);border:1px solid var(--key-edge);border-top:0;border-radius:0 0 4px 4px;margin-right:-1px}
.key.b{position:absolute;top:0;height:62%;background:linear-gradient(90deg,#000,var(--key-b) 20%,#2c2e2c 50%,var(--key-b) 80%,#000);border-radius:0 0 3px 3px;z-index:2;box-shadow:0 3px 4px rgba(0,0,0,.5), inset 0 -6px 0 #000}
.key.w.down{background:var(--key-w-down)}
.key.b.down{background:var(--key-b-down)}
.kb-nav{display:none;gap:8px;justify-content:space-between;padding:0 16px 14px}
.kb-nav button{font-family:var(--font-label);font-weight:600;font-size:.95rem;background:#2c2e2b;color:var(--label);border:1px solid #6d716c;border-radius:5px;padding:.4rem .8rem;cursor:pointer}
@media (pointer:coarse){.kb-nav{display:flex}}

.help{max-width:72ch;margin-top:2.6rem;color:var(--muted);font-size:.95rem}
.help p{margin:.4rem 0}
kbd{font-family:var(--font-label);font-size:.9em;padding:0 .3em;border:1px solid currentColor;border-radius:3px}

@media (max-width:860px){
  .bottom{flex-direction:column}
  .side{flex-direction:row;flex-wrap:wrap;align-items:flex-end;gap:14px 22px;border-right:0;border-bottom:2px solid var(--line)}
  .plate{margin-left:0;flex-basis:100%;order:-1}
  .kb{height:160px}
}
@media (max-width:520px){
  .row{padding:10px 8px 12px;gap:6px}
  .mid{padding:12px;gap:14px 20px}
}
@media (prefers-reduced-motion:reduce){.bender .lever{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="sr">SH-101</h1>
  </header>
  <button type="button" class="audio-bar" id="audio-bar" hidden>Som desligado. Toque aqui para ativar.</button>

  <section class="machine" aria-label="Sintetizador">
    <div class="secs">
      <section class="sec" aria-label="Tune"><h2>Tune</h2><div class="row" id="c-tune"></div></section>
      <section class="sec" aria-label="Modulator"><h2>Modulator</h2><div class="row" id="s-mod"></div></section>
      <section class="sec" aria-label="VCO"><h2>VCO</h2><div class="row" id="s-vco"></div></section>
      <section class="sec" aria-label="Source mixer"><h2>Source mixer</h2><div class="row" id="s-mix"></div></section>
      <section class="sec" aria-label="VCF"><h2>VCF</h2><div class="row" id="s-vcf"></div></section>
      <section class="sec" aria-label="VCA"><h2>VCA</h2><div class="row" id="s-vca"></div></section>
      <section class="sec" aria-label="Env"><h2>Env</h2><div class="row" id="s-env"></div></section>
    </div>

    <div class="mid">
      <div class="group">
        <p class="cluster-title">Sequencer</p>
        <div class="btn-row">
          <button type="button" class="pbtn" id="seq-load" aria-pressed="false">Load</button>
          <button type="button" class="pbtn" id="seq-play" aria-pressed="false">Play</button>
          <button type="button" class="pbtn plain" id="seq-rest" disabled>Pausa</button>
        </div>
      </div>
      <div class="group">
        <p class="cluster-title">Arpeggio</p>
        <div class="cluster" id="c-arp"></div>
      </div>
      <div class="group">
        <div class="btn-row">
          <button type="button" class="pbtn" id="hold" aria-pressed="false">Hold</button>
        </div>
      </div>
      <div class="cluster" id="c-tempo"></div>
      <div class="plate" aria-hidden="true">SH-101</div>
      <div class="seqinfo" id="seqinfo" aria-live="polite"></div>
    </div>

    <div class="bottom">
      <div class="side">
        <div class="cluster" id="c-out"></div>
        <div class="cluster" id="c-porta"></div>
        <div class="bend-row">
          <div class="row" id="s-bend"></div>
          <div class="cluster" id="c-transpose"></div>
        </div>
        <div>
          <div class="bender" id="bender" role="slider" tabindex="0" aria-label="Bender" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0" style="--b:0"><div class="lever"></div></div>
          <div class="bend-label">Bender</div>
        </div>
      </div>
      <div class="kb-wrap">
        <div class="kb" id="kb" role="group" aria-label="Teclado de 32 teclas"></div>
      </div>
    </div>
    <div class="kb-nav"><button type="button" id="kb-left" aria-label="Rolar o teclado para os graves">&larr; Graves</button><button type="button" id="kb-right" aria-label="Rolar o teclado para os agudos">Agudos &rarr;</button></div>
  </section>

</div>

<script>
(() => {
'use strict';

const STORE = 'clone-sh101-v1';
const DEF = {
  lfoRate:.45, vcoMod:0, pw:.5, pulse:0, saw:.8, sub:.5, noise:0,
  vcfFreq:.45, vcfRes:.35, vcfEnv:.5, vcfMod:0, vcfKybd:.5,
  A:.05, D:.45, S:.4, R:.3,
  volume:.7, tune:.5, porta:.25, bendVco:.3, bendVcf:.3, tempo:.4
};
const DEF_SW = {lfoWave:'tri', range:'8', pwmSrc:'man', subMode:'1oct', vcaMode:'env', trig:'gatetrig', porta:'off', transpose:'M', arp:'off'};
const SW_OPTS = {
  lfoWave:['tri','square','random','noise'], range:['16','8','4','2'], pwmSrc:['lfo','man','env'],
  subMode:['1oct','2oct','2oct25'], vcaMode:['env','gate'], trig:['gatetrig','gate','lfo'],
  porta:['on','off','auto'], transpose:['H','M','L'], arp:['off','up','ud','down']
};
const RANGE_SHIFT = {'16':-12, '8':0, '4':12, '2':24};
const TRANSPOSE = {L:-12, M:0, H:12};
const KEY_LO = 41, KEY_HI = 72; // F2 a C5: 32 teclas
const NAMES = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];

const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const lfoHz = v => 0.1 * Math.pow(2, v * 8.2);
const cutHz = v => 25 * Math.pow(2, v * 9);
const atkT = v => 0.0015 * Math.pow(2, v * 11);
const decT = v => 0.004 * Math.pow(2, v * 10);
const bpmOf = v => Math.round(40 + v * 200);
const pct = v => Math.round(v * 100) + '%';
const num = (x, d) => x.toLocaleString('pt-BR', {minimumFractionDigits:d, maximumFractionDigits:d});
const secs = x => x < 1 ? Math.round(x * 1000) + ' ms' : num(x, 2) + ' s';
const signed = n => n > 0 ? '+' + n : n < 0 ? '−' + Math.abs(n) : '0';

/* ---------- estado e persistência ---------- */
const st = {v:Object.assign({}, DEF), sw:Object.assign({}, DEF_SW), seq:[], hold:false};
try {
  const s = JSON.parse(localStorage.getItem(STORE) || 'null');
  if (s && typeof s === 'object') {
    if (s.v) for (const k in DEF) { const x = s.v[k]; if (typeof x === 'number' && x >= 0 && x <= 1) st.v[k] = x; }
    if (s.sw) for (const k in DEF_SW) if (SW_OPTS[k].includes(s.sw[k])) st.sw[k] = s.sw[k];
    if (Array.isArray(s.seq)) st.seq = s.seq.filter(n => n === null || (Number.isInteger(n) && n >= 0 && n <= 127)).slice(0, 100);
  }
} catch (e) {}
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { try { localStorage.setItem(STORE, JSON.stringify({v:st.v, sw:st.sw, seq:st.seq})); } catch (e) {} }, 300);
}

/* ---------- motor de áudio ---------- */
let ctx = null, V = null, pumpTimer = null;

function curve(fn, n = 2048){
  const c = new Float32Array(n);
  for (let i = 0; i < n; i++) c[i] = fn(i / (n - 1) * 2 - 1);
  return c;
}
function pulseWave(c, duty, N = 64){
  const re = new Float32Array(N), im = new Float32Array(N);
  for (let n = 1; n < N; n++) {
    re[n] = 2 * Math.sin(2 * Math.PI * n * duty) / (Math.PI * n);
    im[n] = 2 * (1 - Math.cos(2 * Math.PI * n * duty)) / (Math.PI * n);
  }
  return c.createPeriodicWave(re, im);
}
function noiseBuffer(c){
  const b = c.createBuffer(1, c.sampleRate * 2, c.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return b;
}

function build(c){
  const cs = (v = 0) => { const s = c.createConstantSource(); s.offset.value = v; s.start(); return s; };
  const g = (v = 1) => { const n = c.createGain(); n.gain.value = v; return n; };
  const nbuf = noiseBuffer(c);
  const waves = {sq:pulseWave(c, .5), p25:pulseWave(c, .25)};

  // fontes
  const saw = c.createOscillator(); saw.type = 'sawtooth';
  const sub = c.createOscillator(); sub.setPeriodicWave(waves.sq);
  const noise = c.createBufferSource(); noise.buffer = nbuf; noise.loop = true;

  // pulso com largura variável: dente de serra + deslocamento, cortado por um limiar
  const pwSum = g(1), pwMan = cs(0);
  const pwShape = c.createWaveShaper(); pwShape.curve = curve(x => Math.tanh(40 * x)); pwShape.oversample = '4x';
  saw.connect(pwSum); pwMan.connect(pwSum); pwSum.connect(pwShape);

  const lvl = {saw:g(0), pulse:g(0), sub:g(0), noise:g(0)};
  const mix = g(0.42);
  saw.connect(lvl.saw); pwShape.connect(lvl.pulse); sub.connect(lvl.sub); noise.connect(lvl.noise);
  for (const k in lvl) lvl[k].connect(mix);

  // filtro de 24 dB/oitava aproximado com dois biquads
  const f1 = c.createBiquadFilter(); f1.type = 'lowpass';
  const f2 = c.createBiquadFilter(); f2.type = 'lowpass'; f2.Q.value = -2;
  const pre = g(1);
  const drive = c.createWaveShaper(); drive.curve = curve(x => Math.tanh(1.8 * x) / Math.tanh(1.8)); drive.oversample = '2x';
  const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 25; hp.Q.value = -3;
  const amp = g(0), vol = g(0.6);
  const lim = c.createDynamicsCompressor();
  lim.threshold.value = -8; lim.knee.value = 6; lim.ratio.value = 12; lim.attack.value = 0.003; lim.release.value = 0.15;
  mix.connect(f1); f1.connect(f2); f2.connect(pre); pre.connect(drive); drive.connect(hp); hp.connect(amp);
  amp.connect(vol); vol.connect(lim); lim.connect(c.destination);

  // envelope e gate
  const env = cs(0), gate = cs(0);
  const envToAmp = g(1), gateToAmp = g(0);
  env.connect(envToAmp); envToAmp.connect(amp.gain);
  gate.connect(gateToAmp); gateToAmp.connect(amp.gain);

  // LFO
  const lfoOsc = c.createOscillator(); lfoOsc.type = 'triangle';
  const lfoRand = cs(0);
  const lfoNoise = c.createBufferSource(); lfoNoise.buffer = nbuf; lfoNoise.loop = true; lfoNoise.loopStart = 0.7;
  const lfoSel = {osc:g(1), rand:g(0), noise:g(0)};
  const lfoOut = g(1);
  lfoOsc.connect(lfoSel.osc); lfoRand.connect(lfoSel.rand); lfoNoise.connect(lfoSel.noise);
  for (const k in lfoSel) lfoSel[k].connect(lfoOut);

  // destinos de modulação
  const lfoPitch = g(0), lfoCut = g(0), pwLfo = g(0), pwEnv = g(0), envCut = g(0);
  const keyTrack = cs(0), bender = cs(0), bendVco = g(0), bendVcf = g(0);
  lfoOut.connect(lfoPitch); lfoOut.connect(lfoCut); lfoOut.connect(pwLfo);
  pwLfo.connect(pwSum); env.connect(pwEnv); pwEnv.connect(pwSum);
  env.connect(envCut);
  bender.connect(bendVco); bender.connect(bendVcf);
  for (const o of [saw, sub]) { lfoPitch.connect(o.detune); bendVco.connect(o.detune); }
  for (const f of [f1, f2]) { envCut.connect(f.detune); lfoCut.connect(f.detune); keyTrack.connect(f.detune); bendVcf.connect(f.detune); }

  saw.start(); sub.start(); noise.start(); lfoOsc.start(); lfoNoise.start();
  return {saw, sub, waves, pwMan, pwLfo, pwEnv, lvl, f1, f2, pre, vol, env, gate, envToAmp, gateToAmp,
          lfoOsc, lfoRand, lfoSel, lfoPitch, lfoCut, envCut, keyTrack, bender, bendVco, bendVcf};
}

/* iPhone e iPad: o som só liga com um toque solto ou um clique, a chave de silêncio só é ignorada com a sessão "playback", e o contexto pode ser interrompido */
let audioBar = document.getElementById('audio-bar');
function syncAudioBar(){
  if (!audioBar) return;
  audioBar.hidden = !(window.matchMedia('(pointer: coarse)').matches && !(ctx && ctx.state === 'running'));
}
function unlockAudio(){
  ensureAudio();
  try { const b = ctx.createBuffer(1, 1, 22050), s = ctx.createBufferSource(); s.buffer = b; s.connect(ctx.destination); s.start(0); } catch (e) {}
  syncAudioBar();
}
for (const ev of ['touchend', 'pointerup', 'click', 'keydown']) document.addEventListener(ev, () => { if (!ctx || ctx.state !== 'running') unlockAudio(); }, {capture:true, passive:true});
document.addEventListener('visibilitychange', () => { if (!document.hidden && ctx && ctx.state !== 'running') { const r = ctx.resume(); if (r && r.catch) r.catch(() => {}); } });
window.addEventListener('pageshow', syncAudioBar);
if (audioBar) audioBar.addEventListener('click', unlockAudio);
syncAudioBar();

function ensureAudio(){
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    ctx.onstatechange = syncAudioBar;
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    V = build(ctx);
    for (const k in DEF) applyV(k);
    for (const k in DEF_SW) applySw(k);
    pumpTimer = setInterval(pump, 25);
  }
  if (ctx.state !== 'running') { const r = ctx.resume(); if (r && r.catch) r.catch(() => {}); }
}

const smooth = (p, v) => p.setTargetAtTime(v, ctx.currentTime, 0.012);
function applyPw(){
  const v = st.v.pw, src = st.sw.pwmSrc;
  smooth(V.pwMan.offset, src === 'man' ? v * .9 : src === 'lfo' ? v * .45 : 0);
  smooth(V.pwLfo.gain, src === 'lfo' ? v * .45 : 0);
  smooth(V.pwEnv.gain, src === 'env' ? v * .9 : 0);
}
function applyV(id){
  if (!V) return;
  const v = st.v[id];
  switch (id) {
    case 'lfoRate': smooth(V.lfoOsc.frequency, lfoHz(v)); break;
    case 'vcoMod': smooth(V.lfoPitch.gain, v * v * 1200); break;
    case 'pw': applyPw(); break;
    case 'pulse': case 'saw': case 'sub': case 'noise': smooth(V.lvl[id].gain, v); break;
    case 'vcfFreq': smooth(V.f1.frequency, cutHz(v)); smooth(V.f2.frequency, cutHz(v)); break;
    case 'vcfRes': smooth(V.f1.Q, v * 26); smooth(V.pre.gain, 1 / (1 + v * 1.8)); break;
    case 'vcfEnv': smooth(V.envCut.gain, v * 6000); break;
    case 'vcfMod': smooth(V.lfoCut.gain, v * v * 4800); break;
    case 'vcfKybd': if (curNote !== null) smooth(V.keyTrack.offset, v * (curNote - 60) * 100); break;
    case 'volume': smooth(V.vol.gain, v * v * 1.2); break;
    case 'tune': smooth(V.saw.detune, (v - .5) * 200); smooth(V.sub.detune, (v - .5) * 200); break;
    case 'bendVco': smooth(V.bendVco.gain, v * 1200); break;
    case 'bendVcf': smooth(V.bendVcf.gain, v * 4800); break;
  }
}
function applySw(id){
  if (id === 'arp' || id === 'transpose' || id === 'porta' || id === 'trig') { if (id === 'arp') arpChanged(); return; }
  if (!V) return;
  const s = st.sw[id];
  switch (id) {
    case 'lfoWave':
      if (s === 'tri' || s === 'square') V.lfoOsc.type = s === 'tri' ? 'triangle' : 'square';
      smooth(V.lfoSel.osc.gain, s === 'tri' || s === 'square' ? 1 : 0);
      smooth(V.lfoSel.rand.gain, s === 'random' ? 1 : 0);
      smooth(V.lfoSel.noise.gain, s === 'noise' ? 1 : 0);
      break;
    case 'subMode':
      V.sub.setPeriodicWave(s === '2oct25' ? V.waves.p25 : V.waves.sq);
      if (curNote !== null) setPitch(curNote, ctx.currentTime, false);
      break;
    case 'range': if (curNote !== null) setPitch(curNote, ctx.currentTime, false); break;
    case 'pwmSrc': applyPw(); break;
    case 'vcaMode':
      smooth(V.envToAmp.gain, s === 'env' ? 1 : 0);
      smooth(V.gateToAmp.gain, s === 'gate' ? 1 : 0);
      break;
  }
}

/* ---------- voz ---------- */
let curNote = null, kbGate = false, lfoTrigNext = 0, randNext = 0, clockNext = 0;

function setPitch(note, t, glide){
  const vco = mtof(note + RANGE_SHIFT[st.sw.range]);
  const div = st.sw.subMode === '1oct' ? 2 : 4;
  const tau = st.v.porta * st.v.porta * 1.5 / 4;
  const targets = [[V.saw.frequency, vco], [V.sub.frequency, vco / div], [V.keyTrack.offset, st.v.vcfKybd * (note - 60) * 100]];
  for (const [p, val] of targets) {
    p.cancelScheduledValues(t);
    if (glide && tau > 0.002) p.setTargetAtTime(val, t, tau); else p.setValueAtTime(val, t);
  }
  curNote = note;
}
function envOn(t){
  const e = V.env.offset, a = atkT(st.v.A);
  e.cancelScheduledValues(t);
  e.setTargetAtTime(1, t, Math.max(a / 3, 0.0005));
  e.setTargetAtTime(st.v.S, t + a, Math.max(decT(st.v.D) / 4, 0.001));
}
function envOff(t){
  const e = V.env.offset;
  e.cancelScheduledValues(t);
  e.setTargetAtTime(0, t, Math.max(decT(st.v.R) / 4, 0.001));
}
function gateOn(t){ const p = V.gate.offset; p.cancelScheduledValues(t); p.setTargetAtTime(1, t, 0.002); }
function gateOff(t){ const p = V.gate.offset; p.cancelScheduledValues(t); p.setTargetAtTime(0, t, 0.004); }

function playNote(note, t, legato, fromKb){
  setPitch(note, t, st.sw.porta === 'on' || (st.sw.porta === 'auto' && legato));
  const lfoTrig = fromKb && st.sw.trig === 'lfo';
  if (!legato) {
    gateOn(t);
    if (lfoTrig) lfoTrigNext = t; else envOn(t);
  } else if (st.sw.trig === 'gatetrig') envOn(t);
  if (fromKb) { kbGate = true; if (lfoTrig) pump(); }
}
function releaseNote(t, fromKb){
  gateOff(t); envOff(t);
  if (fromKb) kbGate = false;
}

/* ---------- relógio: LFO aleatório, disparo por LFO, arpejador e sequenciador ---------- */
const stepDur = () => 60 / bpmOf(st.v.tempo) / 4;
const ledQueue = [];
let arpCount = 0, seqPos = 0, seqTranspose = 0, seqMode = 'off';
const arpOn = () => st.sw.arp !== 'off';

function pump(){
  if (!ctx) return;
  const now = ctx.currentTime, horizon = now + 0.12;
  if (st.sw.lfoWave === 'random') {
    if (randNext < now) randNext = now;
    while (randNext < horizon) { V.lfoRand.offset.setValueAtTime(Math.random() * 2 - 1, randNext); randNext += 1 / lfoHz(st.v.lfoRate); }
  }
  if (st.sw.trig === 'lfo' && kbGate && !arpOn() && seqMode !== 'play') {
    if (lfoTrigNext < now) lfoTrigNext = now;
    while (lfoTrigNext < horizon) {
      const p = 1 / lfoHz(st.v.lfoRate);
      envOn(lfoTrigNext); envOff(lfoTrigNext + p / 2);
      lfoTrigNext += p;
    }
  }
  if (arpOn() || seqMode === 'play') {
    if (clockNext < now) clockNext = now + 0.02;
    while (clockNext < horizon) { clockStep(clockNext); ledQueue.push(clockNext); clockNext += stepDur(); }
  }
}
function clockStep(t){
  const dur = stepDur();
  if (arpOn()) {
    const notes = [...arpSet].sort((a, b) => a - b).map(k => k + TRANSPOSE[st.sw.transpose]);
    const n = notes.length; if (!n) return;
    const c = arpCount++;
    let i;
    if (st.sw.arp === 'up') i = c % n;
    else if (st.sw.arp === 'down') i = n - 1 - (c % n);
    else if (n === 1) i = 0;
    else { const p = c % (2 * n - 2); i = p < n ? p : 2 * n - 2 - p; }
    playNote(notes[i], t, false, false); releaseNote(t + dur * 0.5, false);
  } else if (seqMode === 'play' && st.seq.length) {
    const note = st.seq[seqPos % st.seq.length]; seqPos++;
    if (note === null) return;
    playNote(note + seqTranspose, t, false, false); releaseNote(t + dur * 0.5, false);
  }
}
const clockLed = document.createElement('span'); clockLed.className = 'clock'; clockLed.setAttribute('aria-hidden', 'true');
function drawLed(){
  if (ctx) {
    const now = ctx.currentTime;
    let lit = false;
    while (ledQueue.length && ledQueue[0] + 0.06 < now) ledQueue.shift();
    if (ledQueue.length && ledQueue[0] <= now) lit = true;
    clockLed.classList.toggle('on', lit);
  }
  requestAnimationFrame(drawLed);
}
requestAnimationFrame(drawLed);

/* ---------- lógica de teclado ---------- */
const phys = new Map();   // tecla física → nota tocada
const stack = [];         // notas seguradas, a última tem prioridade
const arpSet = new Set(); // teclas no arpejador
const keyEls = {};

function keyDown(key){
  ensureAudio();
  if (phys.has(key)) return;
  const wasEmpty = phys.size === 0;
  const note = key + TRANSPOSE[st.sw.transpose];
  phys.set(key, note); markKey(key, true);
  const now = ctx.currentTime + 0.005;
  if (seqMode === 'play') { seqTranspose = key - 60; renderSeqInfo(); return; }
  if (arpOn()) { if (st.hold && wasEmpty) arpSet.clear(); arpSet.add(key); return; }
  if (seqMode === 'load' && st.seq.length < 100) { st.seq.push(note); renderSeqInfo(); save(); }
  const legato = stack.length > 0 || (st.hold && kbGate);
  stack.push(note);
  playNote(note, now, legato, true);
}
function keyUp(key){
  if (!phys.has(key)) return;
  const note = phys.get(key); phys.delete(key); markKey(key, false);
  if (!ctx || seqMode === 'play') return;
  const now = ctx.currentTime + 0.005;
  if (arpOn()) { if (!st.hold) arpSet.delete(key); return; }
  const idx = stack.lastIndexOf(note);
  const wasTop = idx === stack.length - 1;
  if (idx >= 0) stack.splice(idx, 1);
  if (st.hold) return;
  if (stack.length) { if (wasTop) playNote(stack[stack.length - 1], now, true, true); }
  else releaseNote(now, true);
}
function allNotesOff(){
  stack.length = 0; arpSet.clear(); arpCount = 0;
  if (ctx) releaseNote(ctx.currentTime, true);
}
function arpChanged(){
  arpCount = 0;
  if (arpOn()) {
    if (seqMode === 'play') setSeqMode('off');
    stack.length = 0; arpSet.clear();
    for (const k of phys.keys()) arpSet.add(k);
    if (ctx) releaseNote(ctx.currentTime, true);
  } else allNotesOff();
}

/* ---------- controles genéricos ---------- */
function attachDrag(el, get, set){
  let sv = 0, sp = 0, active = null;
  el.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    el.setPointerCapture(e.pointerId); active = e.pointerId; sv = get(); sp = e.clientY;
    el.focus({preventScroll:true}); e.preventDefault();
  });
  el.addEventListener('pointermove', e => { if (e.pointerId === active) set(sv + (sp - e.clientY) / (e.shiftKey ? 600 : 140)); });
  const end = e => { if (e.pointerId === active) active = null; };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  el.addEventListener('wheel', e => { e.preventDefault(); set(get() - Math.sign(e.deltaY) * (e.shiftKey ? .005 : .02)); }, {passive:false});
  el.addEventListener('keydown', e => {
    const s = e.shiftKey ? .002 : .01, v = get();
    const map = {ArrowUp:v+s, ArrowRight:v+s, ArrowDown:v-s, ArrowLeft:v-s, PageUp:v+.1, PageDown:v-.1, Home:0, End:1};
    if (e.key in map) { e.preventDefault(); e.stopPropagation(); set(map[e.key]); }
  });
}

function makeCtl(parent, kind, id, label, fmt, wide){
  const wrap = document.createElement('div'); wrap.className = 'ctl' + (wide ? ' wide' : '');
  const el = document.createElement('div'); el.className = kind; el.tabIndex = 0;
  el.setAttribute('role', 'slider'); el.setAttribute('aria-label', label);
  el.setAttribute('aria-valuemin', '0'); el.setAttribute('aria-valuemax', '100');
  if (kind === 'fader') el.innerHTML = '<div class="scale"></div><div class="track"></div><div class="cap"></div>';
  else {
    let ticks = '';
    for (let i = 0; i < 11; i++) {
      const a = (-135 + 27 * i) * Math.PI / 180;
      ticks += `<line x1="${(32 + Math.sin(a) * 27).toFixed(2)}" y1="${(32 - Math.cos(a) * 27).toFixed(2)}" x2="${(32 + Math.sin(a) * 31).toFixed(2)}" y2="${(32 - Math.cos(a) * 31).toFixed(2)}"/>`;
    }
    el.innerHTML = `<svg viewBox="0 0 64 64" aria-hidden="true"><g class="k-ticks">${ticks}</g><circle class="k-skirt" cx="32" cy="32" r="24"/><g class="k-rot"><circle class="k-cap" cx="32" cy="32" r="18"/><line class="k-mark" x1="32" y1="30" x2="32" y2="15"/></g></svg>`;
  }
  const lab = document.createElement('div'); lab.className = 'ctl-label'; lab.textContent = label;
  const out = document.createElement('div'); out.className = 'ctl-val';
  wrap.append(el, lab, out); parent.append(wrap);
  const rot = el.querySelector('.k-rot');
  const render = () => {
    const v = st.v[id], txt = fmt(v);
    if (kind === 'fader') el.style.setProperty('--v', v);
    else rot.setAttribute('transform', `rotate(${(-135 + 270 * v).toFixed(1)} 32 32)`);
    out.textContent = txt;
    el.setAttribute('aria-valuenow', Math.round(v * 100)); el.setAttribute('aria-valuetext', txt);
  };
  const set = v => {
    v = Math.min(1, Math.max(0, v));
    if (v === st.v[id]) return;
    st.v[id] = v; render(); applyV(id); save();
  };
  attachDrag(el, () => st.v[id], set);
  el.addEventListener('dblclick', () => set(DEF[id]));
  render();
  return wrap;
}

const SYM = {

  range:{'16':'16′','8':'8′','4':'4′','2':'2′'},

  subMode:{'1oct':'1 oct', '2oct':'2 oct', '2oct25':'2 oct 25%'},

const swRenderers = {};
function makeSw(parent, id, caption){
  const wrap = document.createElement('div'); wrap.className = 'sw-wrap';
  const box = document.createElement('div'); box.className = 'sw';
  box.setAttribute('role', 'radiogroup'); box.setAttribute('aria-label', caption || id);

    const lab = SW_LABELS[id][opt];

    else b.textContent = lab;
    box.append(b); return b;
  });
  const render = () => btns.forEach(b => { const on = b.dataset.opt === st.sw[id]; b.setAttribute('aria-checked', on); b.tabIndex = on ? 0 : -1; });
  const set = opt => { if (st.sw[id] === opt) return; st.sw[id] = opt; render(); applySw(id); save(); };

  parent.append(wrap); render(); swRenderers[id] = render;
}

document.querySelectorAll('#s-bend .fader').forEach(f => { f.style.height = '70px'; });

/* ---------- sequenciador e hold ---------- */
const loadBtn = $('seq-load'), playBtn = $('seq-play'), restBtn = $('seq-rest'), holdBtn = $('hold'), seqInfo = $('seqinfo');
function renderSeqInfo(){
  const n = st.seq.length;
  loadBtn.setAttribute('aria-pressed', seqMode === 'load');
  playBtn.setAttribute('aria-pressed', seqMode === 'play');
  restBtn.disabled = seqMode !== 'load';
  if (seqMode === 'load') seqInfo.textContent = `Gravando: ${n} ${n === 1 ? 'passo' : 'passos'}${n >= 100 ? ' (limite)' : ''}`;
  else if (seqMode === 'play') seqInfo.textContent = `Tocando ${n} ${n === 1 ? 'passo' : 'passos'}` + (seqTranspose ? `, transposição ${signed(seqTranspose)}` : '');
  else seqInfo.textContent = n ? `${n} ${n === 1 ? 'passo gravado' : 'passos gravados'}` : 'Sequência vazia';
}
function setSeqMode(m){
  ensureAudio();
  if (m === 'load') { st.seq = []; save(); }
  if (m === 'play') {
    if (!st.seq.length) { seqMode = 'off'; renderSeqInfo(); seqInfo.textContent = 'Grave notas com Load antes de tocar'; return; }
    if (arpOn()) { st.sw.arp = 'off'; swRenderers.arp(); save(); arpCount = 0; arpSet.clear(); }
    seqPos = 0; seqTranspose = 0; clockNext = 0;
  }
  const wasPlaying = seqMode === 'play';
  seqMode = m;
  if (wasPlaying && m !== 'play') allNotesOff();
  stack.length = 0;
  renderSeqInfo();
}
loadBtn.addEventListener('click', () => setSeqMode(seqMode === 'load' ? 'off' : 'load'));
playBtn.addEventListener('click', () => setSeqMode(seqMode === 'play' ? 'off' : 'play'));
restBtn.addEventListener('click', () => { if (seqMode === 'load' && st.seq.length < 100) { st.seq.push(null); renderSeqInfo(); save(); } });
holdBtn.addEventListener('click', () => {
  ensureAudio();
  st.hold = !st.hold; holdBtn.setAttribute('aria-pressed', st.hold);
  if (!st.hold) {
    if (arpOn()) { arpSet.clear(); for (const k of phys.keys()) arpSet.add(k); }
    else if (phys.size === 0) allNotesOff();
  }
});
renderSeqInfo();

/* ---------- bender ---------- */
const bendEl = $('bender');
let bendVal = 0;
function setBend(v){
  bendVal = Math.max(-1, Math.min(1, v));
  bendEl.style.setProperty('--b', bendVal);
  bendEl.setAttribute('aria-valuenow', Math.round(bendVal * 100));
  if (V) V.bender.offset.setTargetAtTime(bendVal, ctx.currentTime, 0.01);
}
(() => {
  let active = null;
  const fromX = e => { const r = bendEl.getBoundingClientRect(); return ((e.clientX - r.left) / r.width) * 2 - 1; };
  bendEl.addEventListener('pointerdown', e => {
    ensureAudio(); bendEl.setPointerCapture(e.pointerId); active = e.pointerId;
    bendEl.classList.add('drag'); setBend(fromX(e)); e.preventDefault();
  });
  bendEl.addEventListener('pointermove', e => { if (e.pointerId === active) setBend(fromX(e)); });
  const end = e => { if (e.pointerId !== active) return; active = null; bendEl.classList.remove('drag'); setBend(0); };
  bendEl.addEventListener('pointerup', end); bendEl.addEventListener('pointercancel', end);
  bendEl.addEventListener('keydown', e => {
    const d = {ArrowRight:1, ArrowUp:1, ArrowLeft:-1, ArrowDown:-1}[e.key]; if (!d) return;
    e.preventDefault(); e.stopPropagation(); ensureAudio(); setBend(bendVal + d * 0.25);
  });
  bendEl.addEventListener('keyup', e => { if (['ArrowRight','ArrowUp','ArrowLeft','ArrowDown'].includes(e.key)) setBend(0); });
})();

/* ---------- teclado na tela ---------- */
const kb = $('kb');
const whites = [];
for (let m = KEY_LO; m <= KEY_HI; m++) if (![1,3,6,8,10].includes(m % 12)) whites.push(m);
const W = 100 / whites.length;
whites.forEach(m => {
  const k = document.createElement('div'); k.className = 'key w'; k.dataset.key = m;
  k.setAttribute('aria-label', NAMES[m % 12] + (Math.floor(m / 12) - 1));
  kb.append(k); keyEls[m] = k;
});
for (let m = KEY_LO; m <= KEY_HI; m++) {
  if (![1,3,6,8,10].includes(m % 12)) continue;
  const left = whites.indexOf(m + 1) * W;
  const k = document.createElement('div'); k.className = 'key b'; k.dataset.key = m;
  k.setAttribute('aria-label', NAMES[m % 12] + (Math.floor(m / 12) - 1));
  k.style.left = `calc(${left}% - ${W * 0.31}%)`; k.style.width = `${W * 0.62}%`;
  kb.append(k); keyEls[m] = k;
}
function markKey(m, on){ if (keyEls[m]) keyEls[m].classList.toggle('down', on); }

const pointerKey = new Map();
const keyAt = (x, y) => { const el = document.elementFromPoint(x, y); return el && el.closest && el.closest('.key') ? +el.closest('.key').dataset.key : null; };
kb.addEventListener('pointerdown', e => {
  const k = keyAt(e.clientX, e.clientY); if (k === null) return;
  kb.setPointerCapture(e.pointerId); pointerKey.set(e.pointerId, k); keyDown(k); e.preventDefault();
});
kb.addEventListener('pointermove', e => {
  if (!pointerKey.has(e.pointerId)) return;
  const k = keyAt(e.clientX, e.clientY), old = pointerKey.get(e.pointerId);
  if (k === null || k === old) return;
  pointerKey.set(e.pointerId, k); keyDown(k); keyUp(old); // nova nota antes de soltar a antiga: legato
});
const kbEnd = e => { if (!pointerKey.has(e.pointerId)) return; keyUp(pointerKey.get(e.pointerId)); pointerKey.delete(e.pointerId); };
kb.addEventListener('pointerup', kbEnd); kb.addEventListener('pointercancel', kbEnd);

/* teclado largo no toque: botões para rolar e início perto do C central */
const kbWrap = kb.parentElement;
const kbScroll = d => kbWrap.scrollBy({left: d * kb.scrollWidth / whites.length * 7, behavior: 'smooth'});
$('kb-left').addEventListener('click', () => kbScroll(-1));
$('kb-right').addEventListener('click', () => kbScroll(1));
if (window.matchMedia('(pointer: coarse)').matches && kbWrap.scrollWidth > kbWrap.clientWidth)
  kbWrap.scrollLeft = Math.max(0, whites.indexOf(60) / whites.length * kb.scrollWidth - kbWrap.clientWidth * 0.3);

/* ---------- teclado do computador ---------- */
const KMAP = {a:0, w:1, s:2, e:3, d:4, f:5, t:6, g:7, y:8, h:9, u:10, j:11, k:12, o:13, l:14, p:15, 'ç':16, ';':16};
let kbBase = 60;
const compHeld = new Map();
document.addEventListener('keydown', e => {
  if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  const ch = e.key.toLowerCase();
  if (ch === 'z') { kbBase = Math.max(36, kbBase - 12); return; }
  if (ch === 'x') { kbBase = Math.min(84, kbBase + 12); return; }
  if (!(ch in KMAP) || compHeld.has(ch)) return;
  const m = kbBase + KMAP[ch]; compHeld.set(ch, m); keyDown(m);
});
document.addEventListener('keyup', e => {
  const ch = e.key.toLowerCase();
  if (!compHeld.has(ch)) return;
  keyUp(compHeld.get(ch)); compHeld.delete(ch);
});
window.addEventListener('blur', () => {
  for (const m of compHeld.values()) keyUp(m); compHeld.clear();
  for (const m of pointerKey.values()) keyUp(m); pointerKey.clear();
});
})();
</script>
