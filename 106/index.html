<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Clone do Juno-106</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
/* Layout: como no aparelho, entre duas laterais pretas. Em cima, as seções com faders sob faixas vermelhas;
   no meio, a fileira de teclas de performance e de patch sob faixas azuis, com o nome do modelo;
   embaixo, o painel da alavanca e o teclado de 61 teclas. O sequenciador acessório fica numa caixa à parte. */
:root{
  --page:#17181a; --ink:#e4e6e8; --muted:#a3a9af;
  --body:#47494e; --body-hi:#55575c; --body-lo:#3a3c40; --edge:#232426; --cheek:#101011;
  --red:#c9432b; --blue:#3f6db3; --line:#27282b; --label:#f1f1ec; --sub:#c3c5c6;
  --slot:#0c0d0d; --tick:#bdbfc0;
  --cap:#343538; --cap-hi:#5b5d61; --stripe:#f1f1ec;
  --knob:#151516; --knob-edge:#050505; --mark:#f1f1ec;
  --keycap:#e9e1a8; --keycap-lo:#b9b17c; --keycap-or:#ef8a2b; --keycap-or-lo:#bd6515; --keycap-gr:#cfd6dc; --keycap-gr-lo:#9aa3ab;
  --led:#ff4433; --led-off:#4a1a15; --focus:#ffcf4a;
  --key-w:#f4f4f0; --key-w-down:#c9cdd0; --key-b:#151516; --key-b-down:#4d5157; --key-edge:#8f9296;
  --cell:#5a5c61; --cell-blk:#3d3f43; --cell-on:#ff7a2e; --now-tint:rgba(255,255,255,.22);
  --font-label:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --font-mark:"Michroma","Eurostile","Arial Black",Arial,sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;color:var(--ink);font-family:var(--font-body);line-height:1.5;-webkit-font-smoothing:antialiased;
  background:radial-gradient(120% 70% at 50% 0%,#33363a 0%,var(--page) 60%,#0f1011 100%) fixed var(--page)}
.wrap{max-width:1440px;margin:0 auto;padding-block:28px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
header p{margin:0 0 1.5rem;max-width:66ch;color:var(--muted)}
button{touch-action:manipulation}

.audio-bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:100;display:block;margin:0;padding:.9rem 1rem;border-radius:10px;border:0;box-shadow:0 6px 20px rgba(0,0,0,.35);background:var(--keycap-or);color:#241703;font-family:var(--font-label);font-weight:600;font-size:1.05rem;cursor:pointer}
.audio-bar[hidden]{display:none}

/* ---------- gabinete ---------- */
.machine{color:var(--label);border-radius:7px;overflow:hidden;border-left:22px solid var(--cheek);border-right:22px solid var(--cheek);
  background:linear-gradient(180deg,var(--body-hi),var(--body) 30%,var(--body-lo));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),
    0 3px 0 var(--edge), 0 7px 1px #0a0a0a, 0 16px 14px rgba(0,0,0,.5), 0 44px 60px -12px rgba(0,0,0,.7)}

/* seções com faixa vermelha */
.secs{display:flex;flex-wrap:wrap;border-bottom:2px solid var(--line)}
.sec{flex:1 1 auto;display:flex;flex-direction:column;border-right:2px solid var(--line);border-bottom:2px solid var(--line);margin-bottom:-2px;max-width:100%}
.sec:last-child{border-right:0}
.sec h2{font-family:var(--font-label);font-weight:700;font-size:1.05rem;letter-spacing:.07em;text-transform:uppercase;color:#fff;
  margin:0;padding:4px 10px 3px;line-height:1.2;text-align:left;background:var(--red);border-bottom:2px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.row{display:flex;gap:4px;align-items:flex-start}
.sec .row,.sec .btn-col{flex-wrap:wrap;row-gap:12px;column-gap:1px;justify-content:center;padding:10px 5px 12px}
.btn-col{display:flex;flex-direction:column;gap:8px}

.ctl{display:flex;flex-direction:column;align-items:center;width:39px}
.ctl.wide{width:74px}
.ctl-label{order:-1;font-family:var(--font-label);font-weight:600;font-size:.82rem;letter-spacing:.04em;text-transform:uppercase;line-height:1.1;margin-bottom:6px;text-align:center;white-space:nowrap}
.ctl-val{font-family:var(--font-label);font-weight:500;font-size:.74rem;color:var(--sub);font-variant-numeric:tabular-nums;min-height:1.15em;white-space:nowrap;margin-top:4px}

/* faders */
.fader{position:relative;width:34px;height:124px;cursor:ns-resize;touch-action:none;outline:none}
.fader.short{height:76px}
.fader .scale{position:absolute;left:0;right:0;top:8px;bottom:8px;
  background:linear-gradient(var(--tick) 1px,transparent 1px) 0 0/100% 10%;border-bottom:1px solid var(--tick);
  -webkit-mask:linear-gradient(90deg,#000 0 8px,transparent 8px calc(100% - 8px),#000 calc(100% - 8px));mask:linear-gradient(90deg,#000 0 8px,transparent 8px calc(100% - 8px),#000 calc(100% - 8px))}
.fader .track{position:absolute;left:50%;top:2px;bottom:2px;width:10px;margin-left:-5px;background:var(--slot);border-radius:2px;box-shadow:inset 0 2px 3px #000, 0 1px 0 rgba(255,255,255,.18)}
.fader .cap{position:absolute;left:5px;width:24px;height:16px;bottom:calc(var(--v) * (100% - 16px));border-radius:2px;
  background:linear-gradient(180deg,var(--cap-hi),var(--cap) 40%,#1f2022);
  box-shadow:0 0 0 1px #0b0b0b, 0 3px 4px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.25)}
.fader .cap::after{content:"";position:absolute;left:2px;right:2px;top:7px;height:2.5px;background:var(--stripe);border-radius:1px}
.fader:focus-visible .cap{outline:3px solid var(--focus);outline-offset:1px}

/* knobs */
.knob{width:58px;height:58px;cursor:ns-resize;touch-action:none;border-radius:50%;outline:none}
.knob svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 4px 3px rgba(0,0,0,.5))}
.k-ticks line{stroke:var(--tick);stroke-width:1.5}
.k-skirt{fill:var(--knob-edge)}
.k-cap{fill:var(--knob);stroke:#3a3b3e;stroke-width:1}
.k-mark{stroke:var(--mark);stroke-width:3;stroke-linecap:butt}
.knob:focus-visible{box-shadow:0 0 0 3px var(--focus)}

/* chaves deslizantes */
.sw-wrap{display:flex;flex-direction:column;align-items:flex-start}
.sw-wrap .ctl-label{text-align:left;padding-left:2px}
.sw{display:flex;flex-direction:column}
.sw button{position:relative;display:flex;align-items:center;gap:7px;background:transparent;border:0;color:var(--sub);font-family:var(--font-label);font-weight:600;font-size:.8rem;letter-spacing:.03em;text-transform:uppercase;
  padding:0 5px 0 0;min-height:24px;cursor:pointer;white-space:nowrap;line-height:1.1}
.sw button::before{content:"";align-self:stretch;width:14px;flex:none;background:var(--slot);box-shadow:inset 2px 0 2px #000, 1px 0 0 rgba(255,255,255,.15)}
.sw button:first-child::before{border-radius:3px 3px 0 0}
.sw button:last-child::before{border-radius:0 0 3px 3px}
.sw button[aria-checked="true"]{color:var(--label)}
.sw button[aria-checked="true"]::before{
  background:linear-gradient(180deg,transparent 0 3px,#8b8e90 3px 4px,#56595c 4px 9px,#dcdddd 9px 11px,#56595c 11px calc(100% - 4px),#2a2b2d calc(100% - 4px) calc(100% - 3px),transparent calc(100% - 3px)) var(--slot)}
.sw button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}

/* teclas com LED em cima e legenda embaixo */
.pbtn,#s-chorus .sw button{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:50px;padding:0;min-height:0;background:none;border:0;cursor:pointer;
  color:var(--label);font-family:var(--font-label);font-weight:600;font-size:.76rem;letter-spacing:.05em;text-transform:uppercase;line-height:1.1;white-space:nowrap}
.pbtn::before,#s-chorus .sw button::before{content:"";order:-2;align-self:center;width:8px;height:8px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 38% 30%,#a8554a,var(--led-off) 55%,#2a0906);box-shadow:0 0 0 1.5px #0b0b0b}
.pbtn::after,#s-chorus .sw button::after{content:"";order:-1;width:40px;height:24px;border-radius:2px;
  background:linear-gradient(180deg,#fbf6cf,var(--keycap) 45%,var(--keycap-lo));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8), inset 0 -3px 0 rgba(0,0,0,.18), 0 0 0 2px #0b0b0b, 0 4px 3px 1px rgba(0,0,0,.45)}
#s-chorus .sw button:not(:first-child)::after{background:linear-gradient(180deg,#ffb468,var(--keycap-or) 45%,var(--keycap-or-lo))}
.pbtn:active::after,#s-chorus .sw button:active::after{transform:translateY(1px)}
.pbtn[aria-pressed="true"]::before,#s-chorus .sw button[aria-checked="true"]::before{
  background:radial-gradient(circle at 38% 30%,#fff,#ffb09c 22%,var(--led) 58%,#a81d0c);
  box-shadow:0 0 0 1.5px #0b0b0b, 0 0 8px 3px var(--led), 0 0 18px 5px rgba(255,70,40,.4)}
.pbtn:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
#s-chorus .sw{flex-direction:row;gap:8px}
#s-chorus .ctl-label{display:none}
#s-chorus .sw button{min-width:42px}
#s-dco .btn-col{flex-direction:row;padding:0;gap:8px}
/* teclas simples: a legenda vai dentro da capa */
.pbtn.plain{display:inline-flex;flex-direction:row;justify-content:center;min-width:0;padding:.42rem .7rem .5rem;border-radius:2px;color:#17181a;font-size:.84rem;
  background:linear-gradient(180deg,#eef2f5,var(--keycap-gr) 45%,var(--keycap-gr-lo));
  box-shadow:inset 0 1px 0 #fff, inset 0 -3px 0 rgba(0,0,0,.18), 0 0 0 2px #0b0b0b, 0 4px 3px 1px rgba(0,0,0,.45)}
.pbtn.plain::before,.pbtn.plain::after{display:none}
.pbtn.plain:active{transform:translateY(1px)}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}

/* ---------- fileira de performance e patches ---------- */
.mid{display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px 30px;padding:12px 18px 16px;border-bottom:2px solid var(--line);background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,0))}
.cluster-title,.slot-lab{font-family:var(--font-label);font-weight:700;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:#fff;
  margin:0 0 10px;padding:2px 8px;background:var(--blue);box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.mid .row{flex-wrap:wrap;row-gap:10px;gap:12px;align-items:flex-start}
.patch{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-start}
.slots{display:flex;gap:7px;padding-top:14px}
.slots button{position:relative;width:32px;height:28px;border-radius:2px;border:0;padding:0 0 3px;cursor:pointer;color:#17181a;font-family:var(--font-label);font-weight:700;font-size:.95rem;
  background:linear-gradient(180deg,#eef2f5,var(--keycap-gr) 45%,var(--keycap-gr-lo));
  box-shadow:inset 0 1px 0 #fff, inset 0 -3px 0 rgba(0,0,0,.18), 0 0 0 2px #0b0b0b, 0 4px 3px 1px rgba(0,0,0,.45)}
.slots button::before{content:"";position:absolute;left:50%;top:-13px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;
  background:radial-gradient(circle at 38% 30%,#a8554a,var(--led-off) 55%,#2a0906);box-shadow:0 0 0 1.5px #0b0b0b}
.slots button[aria-checked="true"]::before,.acc-ctl .slots button.on-len::before{
  background:radial-gradient(circle at 38% 30%,#fff,#ffb09c 22%,var(--led) 58%,#a81d0c);
  box-shadow:0 0 0 1.5px #0b0b0b, 0 0 8px 3px var(--led), 0 0 16px 4px rgba(255,70,40,.4)}
.slots button.filled:not([aria-checked="true"]){box-shadow:inset 0 1px 0 #fff, inset 0 -3px 0 var(--blue), 0 0 0 2px #0b0b0b, 0 4px 3px 1px rgba(0,0,0,.45)}
.slots button:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.display{min-width:190px}
.patch-name{font-family:var(--font-mark);font-size:.9rem;min-height:2.3em;display:flex;align-items:center;padding:4px 12px;color:#ff5a45;background:#1c0605;border-radius:3px;
  box-shadow:inset 0 2px 5px #000, 0 0 0 2px #0b0b0b, 0 1px 0 3px rgba(255,255,255,.12);text-shadow:0 0 8px rgba(255,70,40,.7)}
.patch-note{font-family:var(--font-label);font-size:.82rem;color:var(--sub);min-height:1.2em;margin-top:6px}
.plate{margin-left:auto;text-align:right;border-top:5px solid var(--blue);padding-top:8px;align-self:center}
.plate b{display:block;font-family:var(--font-mark);font-weight:400;font-size:clamp(1.7rem,3.6vw,2.7rem);line-height:1;letter-spacing:.03em;white-space:nowrap;
  color:transparent;-webkit-text-stroke:1.5px var(--label)}
.plate span{display:block;font-family:var(--font-label);font-weight:600;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;margin-top:6px;white-space:nowrap}

/* ---------- alavanca e teclado ---------- */
.bottom{display:flex;align-items:stretch}
.side{flex:none;display:flex;flex-direction:column;gap:12px;padding:14px 16px 16px;border-right:2px solid var(--line)}
.side .cluster-title{margin-bottom:8px}
.side .row{gap:8px}
.lever{position:relative;width:130px;height:110px;border-radius:4px;background:var(--slot);touch-action:none;cursor:grab;outline:none;box-shadow:inset 0 2px 5px #000, 0 1px 0 rgba(255,255,255,.18)}
.lever::before,.lever::after{content:"";position:absolute;background:#4a4c50}
.lever::before{left:50%;top:10px;bottom:10px;width:1px}
.lever::after{top:calc(100% - 28px);left:10px;right:10px;height:1px}
.lever .dot{position:absolute;width:34px;height:30px;border-radius:3px;background:linear-gradient(90deg,#1f2022,var(--cap-hi) 30%,var(--cap) 70%,#161718);box-shadow:0 0 0 1px #000,0 4px 4px rgba(0,0,0,.6);
  left:calc(50% - 17px + var(--bx) * (50% - 24px));top:calc(100% - 43px - var(--my) * (100% - 62px));transition:left .14s ease-out,top .14s ease-out}
.lever.drag .dot{transition:none}
.lever:focus-visible{box-shadow:0 0 0 3px var(--focus)}
.lever-label{font-family:var(--font-label);font-weight:600;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;text-align:center;margin-top:5px}
.kb-wrap{flex:1;min-width:0;overflow-x:auto;padding:14px 16px 16px;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.05))}
.kb{position:relative;display:flex;height:200px;min-width:900px;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none;border-top:5px solid #0b0b0b;box-shadow:0 6px 8px rgba(0,0,0,.45)}
.key{cursor:pointer}
.key.w{flex:1;background:linear-gradient(180deg,#dcdcd6,var(--key-w) 12%,var(--key-w) 88%,#d5d5cf);border:1px solid var(--key-edge);border-top:0;border-radius:0 0 4px 4px;margin-right:-1px}
.key.b{position:absolute;top:0;height:62%;background:linear-gradient(90deg,#000,var(--key-b) 20%,#2c2d2f 50%,var(--key-b) 80%,#000);border-radius:0 0 3px 3px;z-index:2;box-shadow:0 3px 4px rgba(0,0,0,.5), inset 0 -6px 0 #000}
.key.w.down{background:var(--key-w-down)}
.key.b.down{background:var(--key-b-down)}
.kb-nav{display:none;gap:10px;justify-content:space-between;padding:0 16px 14px}
@media (pointer:coarse){.kb-nav{display:flex}.pbtn.plain{min-height:44px;align-items:center}.sw button{min-height:32px}.slots button{width:38px;height:34px}}

/* ---------- sequenciador acessório: caixa separada ---------- */
.accessory{margin-top:26px;color:var(--label);border-radius:7px;padding:16px 18px 14px;
  background:linear-gradient(180deg,#2f3033,#232426);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15), inset 0 0 0 1px rgba(0,0,0,.6), 0 3px 0 #111, 0 14px 16px rgba(0,0,0,.5)}
.acc-head h2{font-family:var(--font-label);font-weight:700;font-size:1.05rem;letter-spacing:.08em;text-transform:uppercase;margin:0;line-height:1.2;display:inline-block;background:var(--blue);color:#fff;padding:2px 10px}
.acc-head p{margin:.5rem 0 1rem;color:var(--sub);font-size:.92rem;max-width:72ch}
.acc-ctl{display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px 28px}
.acc-ctl .ctl-label{order:0;margin:6px 0 0}
.acc-ctl .ctl .ctl-label{order:-1;margin:0 0 6px}
.pbtn.big{font-size:1rem}
.pbtn.big::after{width:84px;height:40px;background:linear-gradient(180deg,#ffb468,var(--keycap-or) 45%,var(--keycap-or-lo))}
.oct-row{display:flex;align-items:center;gap:8px}
.oct-val{font-family:var(--font-label);font-weight:600;min-width:5.5em;text-align:center;font-variant-numeric:tabular-nums}
.seq-scroll{overflow-x:auto;margin-top:14px;padding-bottom:6px}
.seqgrid{display:grid;grid-template-columns:44px repeat(16,minmax(26px,1fr));gap:2px;min-width:620px;user-select:none;-webkit-user-select:none}
.sl{font-family:var(--font-label);font-size:.78rem;color:var(--sub);display:flex;align-items:center;justify-content:flex-end;padding-right:6px;line-height:1}
.sl.c{color:var(--label);font-weight:700}
.sh{font-family:var(--font-label);font-size:.82rem;color:var(--sub);text-align:center;font-variant-numeric:tabular-nums}
.sh.now{color:var(--led);font-weight:700}
.sh.hid{text-decoration:underline dotted}
.sc{appearance:none;border:0;border-radius:2px;height:13px;padding:0;background:var(--cell);cursor:pointer;box-shadow:inset 0 1px 1px rgba(0,0,0,.4)}
.sc.blk{background:var(--cell-blk)}
.sc.beat,.sh.beat{margin-left:3px}
.sc.on{background:var(--cell-on);box-shadow:0 0 6px rgba(255,122,46,.6)}
.sc.now{background-image:linear-gradient(var(--now-tint),var(--now-tint))}
.sc.off,.sh.off{opacity:.3}
.sc:focus-visible{outline:2px solid var(--focus);outline-offset:1px}

.help{max-width:74ch;margin-top:2.2rem;color:var(--muted);font-size:.95rem}
.help p{margin:.4rem 0}
kbd{font-family:var(--font-label);font-size:.9em;padding:0 .3em;border:1px solid currentColor;border-radius:3px}

@media (max-width:860px){
  .machine{border-left-width:8px;border-right-width:8px}
  .bottom{flex-direction:column}
  .side{flex-direction:row;flex-wrap:wrap;align-items:flex-start;gap:14px 22px;border-right:0;border-bottom:2px solid var(--line)}
  .plate{margin-left:0;flex-basis:100%;order:-1;text-align:left}
  .kb{height:160px}
  .mid{padding:12px}
}
@media (prefers-reduced-motion:reduce){.lever .dot{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="sr">Juno-106</h1>
  </header>
  <button type="button" class="audio-bar" id="audio-bar" hidden>Som desligado. Toque aqui para ativar.</button>

  <section class="machine" aria-label="Sintetizador">
    <div class="secs">
      <section class="sec" aria-label="LFO"><h2>LFO</h2><div class="row" id="s-lfo"></div></section>
      <section class="sec" aria-label="DCO"><h2>DCO</h2><div class="row" id="s-dco"></div></section>
      <section class="sec" aria-label="HPF"><h2>HPF</h2><div class="row" id="s-hpf"></div></section>
      <section class="sec" aria-label="VCF"><h2>VCF</h2><div class="row" id="s-vcf"></div></section>
      <section class="sec" aria-label="VCA"><h2>VCA</h2><div class="row" id="s-vca"></div></section>
      <section class="sec" aria-label="Envelope"><h2>Env</h2><div class="row" id="s-env"></div></section>
      <section class="sec" aria-label="Chorus"><h2>Chorus</h2><div class="btn-col" id="s-chorus"></div></section>
    </div>

    <div class="mid">
      <div>
        <p class="cluster-title">Performance</p>
        <div class="row" id="c-perf"></div>
      </div>
      <div class="patch">
        <div>
          <div class="slot-lab">Grupo</div>
          <div class="slots" id="grp" role="radiogroup" aria-label="Grupo de bancos"></div>
        </div>
        <div>
          <div class="slot-lab">Bank</div>
          <div class="slots" id="bank" role="radiogroup" aria-label="Banco"></div>
        </div>
        <div>
          <div class="slot-lab">Patch number</div>
          <div class="slots" id="num" role="radiogroup" aria-label="Número do patch"></div>
        </div>
        <div class="display">
          <div class="patch-name" id="pname" aria-live="polite"></div>
          <div class="patch-note" id="pnote" aria-live="polite"></div>
          <div class="btn-row" style="margin-top:8px">
            <button type="button" class="pbtn plain" id="write">Gravar patch</button>

<script>
(() => {
'use strict';

const STORE = 'clone-juno106-v1';
const NV = 6;
const DEF = {
  lfoRate:.4, lfoDelay:0, dcoLfo:0, pwm:.5, sub:.3, noise:0,
  vcfFreq:.6, vcfRes:.2, vcfEnv:.4, vcfLfo:0, vcfKybd:.5,
  vcaLevel:.8, A:.05, D:.45, S:.5, R:.3,
  portaTime:.25, bendDco:.3, bendVcf:.2, bendLfo:.45, tune:.5, volume:.7, seqTempo:.4, seqGate:.6
};
const DEF_SW = {range:'8', pwmSrc:'man', hpf:'1', envPol:'+', vcaMode:'env', porta:'off', assign:'poly1', chorus:'off',
                saw:true, pulse:false, hold:false};
const SW_OPTS = {
  range:['16','8','4'], pwmSrc:['lfo','man'], hpf:['0','1','2','3'], envPol:['+','-'],
  vcaMode:['env','gate'], porta:['on','off'], assign:['poly1','poly2','unison'], chorus:['off','1','2']
};
const BOOLS = ['saw','pulse','hold'];
const GLOBAL_V = ['volume','tune','seqTempo','seqGate'];
const RANGE_SHIFT = {'16':-12, '8':0, '4':12};
const KEY_LO = 36, KEY_HI = 96; // C2 a C7: 61 teclas
const NAMES = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];

const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const lfoHz = v => 0.3 * Math.pow(2, v * 6.1);
const cutHz = v => 25 * Math.pow(2, v * 9);
const atkT = v => 0.0015 * Math.pow(2, v * 11);
const decT = v => 0.004 * Math.pow(2, v * 10);
const dlyT = v => v * v * 3;
const pct = v => Math.round(v * 100) + '%';
const num = (x, d) => x.toLocaleString('pt-BR', {minimumFractionDigits:d, maximumFractionDigits:d});
const secs = x => x < 1 ? Math.round(x * 1000) + ' ms' : num(x, 2) + ' s';
const signed = n => n > 0 ? '+' + n : n < 0 ? '−' + Math.abs(n) : '0';

/* ---------- patches de fábrica (banco 1) ---------- */
const FACTORY = {
  'A11': {name:'Metais', v:{A:.14, D:.5, S:.6, R:.2, vcfFreq:.4, vcfEnv:.55, vcfRes:.15, sub:.15}, sw:{saw:true, pulse:false, chorus:'1'}},
  'A12': {name:'Cordas', v:{A:.55, D:.5, S:.8, R:.55, vcfFreq:.6, vcfEnv:.15, pwm:.55, sub:.2}, sw:{saw:true, pulse:true, pwmSrc:'lfo', chorus:'2'}},
  'A13': {name:'Baixo', v:{A:0, D:.3, S:.2, R:.12, vcfFreq:.22, vcfRes:.35, vcfEnv:.55, sub:.65}, sw:{range:'16', saw:true, pulse:false}},
  'A14': {name:'Pad suave', v:{A:.6, D:.5, S:.75, R:.7, vcfFreq:.5, vcfEnv:.1, pwm:.6, sub:.25, lfoRate:.2}, sw:{saw:false, pulse:true, pwmSrc:'lfo', chorus:'2'}},
  'A15': {name:'Pluck', v:{A:0, D:.28, S:0, R:.2, vcfFreq:.3, vcfEnv:.7, vcfRes:.25}, sw:{saw:true, pulse:false}},
  'A16': {name:'Varredura', v:{A:.35, D:.5, S:.7, R:.5, vcfFreq:.3, vcfRes:.6, vcfLfo:.5, lfoRate:.25}, sw:{saw:true, pulse:false, chorus:'1'}},
  'A17': {name:'Órgão', v:{A:0, D:.3, S:1, R:.1, vcfFreq:.75, vcfEnv:0, sub:.8, pwm:.3}, sw:{range:'8', saw:true, pulse:true, hpf:'2'}},
  'A18': {name:'Lead', v:{A:.02, D:.4, S:.8, R:.2, vcfFreq:.55, vcfRes:.3, vcfEnv:.3, lfoDelay:.4, dcoLfo:.15, portaTime:.2, sub:.1}, sw:{saw:true, pulse:true, porta:'on', chorus:'1'}}
};

/* ---------- estado e persistência ---------- */
function cleanV(o){
  const r = {};
  if (o && typeof o === 'object') for (const k in DEF) { const x = o[k]; if (typeof x === 'number' && x >= 0 && x <= 1) r[k] = x; }
  return r;
}
function cleanSw(o){
  const r = {};
  if (o && typeof o === 'object') {
    for (const k in SW_OPTS) if (SW_OPTS[k].includes(o[k])) r[k] = o[k];
    for (const k of BOOLS) if (typeof o[k] === 'boolean') r[k] = o[k];
    if (!('chorus' in r) && (o.chorus1 || o.chorus2)) r.chorus = o.chorus2 ? '2' : '1'; // migra patches antigos
  }
  return r;
}
const st = {v:Object.assign({}, DEF), sw:Object.assign({}, DEF_SW), patches:{}, group:'A', bank:1, num:1, seq:null};
function exampleSteps(){
  const a = Array.from({length:16}, () => []);
  a[0] = [57,60,64,67]; a[4] = [53,57,60,64]; a[8] = [55,59,62,65]; a[12] = [52,55,59,62];
  a[2] = [69]; a[6] = [67]; a[10] = [71]; a[14] = [64];
  return a;
}
function cleanSeq(o){
  const r = {len:16, base:48, oct:0, steps:exampleSteps()};
  if (o && typeof o === 'object') {
    if ([4,8,12,16].includes(o.len)) r.len = o.len;
    if ([36,48,60,72].includes(o.base)) r.base = o.base;
    if ([-2,-1,0,1,2].includes(o.oct)) r.oct = o.oct;
    if (Array.isArray(o.steps) && o.steps.length === 16)
      r.steps = o.steps.map(a => Array.isArray(a) ? [...new Set(a.filter(n => Number.isInteger(n) && n >= 36 && n <= 96))].sort((x, y) => x - y).slice(0, NV) : []);
  }
  return r;
}
try {
  const s = JSON.parse(localStorage.getItem(STORE) || 'null');
  if (s && typeof s === 'object') {
    Object.assign(st.v, cleanV(s.v)); Object.assign(st.sw, cleanSw(s.sw));
    if (s.patches && typeof s.patches === 'object') {
      for (const k0 of Object.keys(s.patches)) {
        const m = /^([1-8])-([1-8])$/.exec(k0), k = m ? 'A' + m[1] + m[2] : k0; // migra a notação antiga
        if (!/^[AB][1-8][1-8]$/.test(k)) continue;
        const p = s.patches[k0];
        if (p && typeof p === 'object') st.patches[k] = {name:String(p.name || 'Patch ' + k).slice(0, 40), v:cleanV(p.v), sw:cleanSw(p.sw)};
      }
    }
    if (Number.isInteger(s.bank) && s.bank >= 1 && s.bank <= 8) st.bank = s.bank;
    if (Number.isInteger(s.num) && s.num >= 1 && s.num <= 8) st.num = s.num;
    if (s.group === 'A' || s.group === 'B') st.group = s.group;
    if (s.seq) st.seq = cleanSeq(s.seq);
  }
} catch (e) {}
st.sw.hold = false;
if (!st.seq) st.seq = cleanSeq(null);
const keyT = {on:false, semi:0};   // Key Transpose: só nesta sessão
let ktBtn = null, ktOut = null;
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { try { localStorage.setItem(STORE, JSON.stringify(st)); } catch (e) {} }, 300);
}

/* ---------- motor de áudio ---------- */
let ctx = null, S = null, voices = [];

function curve(fn, n = 2048){
  const c = new Float32Array(n);
  for (let i = 0; i < n; i++) c[i] = fn(i / (n - 1) * 2 - 1);
  return c;
}
function noiseBuffer(c){
  const b = c.createBuffer(1, c.sampleRate * 2, c.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return b;
}

function buildShared(c){
  const cs = (v = 0) => { const s = c.createConstantSource(); s.offset.value = v; s.start(); return s; };
  const g = (v = 1) => { const n = c.createGain(); n.gain.value = v; return n; };
  const o = {};
  o.noise = c.createBufferSource(); o.noise.buffer = noiseBuffer(c); o.noise.loop = true; o.noise.start();
  o.pwShape = curve(x => Math.tanh(40 * x));
  o.pwMan = cs(0);
  o.bender = cs(0); o.lever = cs(0);
  o.bendDco = g(0); o.bendVcf = g(0); o.leverLfo = g(0);
  o.bender.connect(o.bendDco); o.bender.connect(o.bendVcf); o.lever.connect(o.leverLfo);

  // LFO com atraso de entrada
  o.lfo = c.createOscillator(); o.lfo.type = 'triangle'; o.lfo.start();
  o.lfoFade = g(1);
  o.lfo.connect(o.lfoFade);
  o.lfoPitch = g(0); o.lfoCut = g(0); o.pwLfo = g(0);
  o.lfoFade.connect(o.lfoPitch); o.lfoFade.connect(o.lfoCut); o.lfoFade.connect(o.pwLfo); o.lfoFade.connect(o.leverLfo);

  // soma das vozes, filtro passa-alta e chorus estéreo
  o.bus = g(1);
  o.shelf = c.createBiquadFilter(); o.shelf.type = 'lowshelf'; o.shelf.frequency.value = 150; o.shelf.gain.value = 0;
  o.hp = c.createBiquadFilter(); o.hp.type = 'highpass'; o.hp.frequency.value = 10; o.hp.Q.value = -3;
  o.bus.connect(o.shelf); o.shelf.connect(o.hp);
  o.dryL = g(1); o.dryR = g(1); o.wetL = g(0); o.wetR = g(0);
  o.dlL = c.createDelay(0.05); o.dlR = c.createDelay(0.05);
  o.dlL.delayTime.value = 0.0054; o.dlR.delayTime.value = 0.0054;
  o.chLfo = c.createOscillator(); o.chLfo.type = 'triangle'; o.chLfo.frequency.value = 0.5; o.chLfo.start();
  o.depL = g(0.0018); o.depR = g(-0.0018);
  o.chLfo.connect(o.depL); o.chLfo.connect(o.depR); o.depL.connect(o.dlL.delayTime); o.depR.connect(o.dlR.delayTime);
  const merger = c.createChannelMerger(2);
  o.hp.connect(o.dryL); o.hp.connect(o.dryR); o.hp.connect(o.dlL); o.hp.connect(o.dlR);
  o.dlL.connect(o.wetL); o.dlR.connect(o.wetR);
  o.dryL.connect(merger, 0, 0); o.wetL.connect(merger, 0, 0);
  o.dryR.connect(merger, 0, 1); o.wetR.connect(merger, 0, 1);
  o.vol = g(0.6);
  o.lim = c.createDynamicsCompressor();
  o.lim.threshold.value = -9; o.lim.knee.value = 6; o.lim.ratio.value = 12; o.lim.attack.value = 0.003; o.lim.release.value = 0.15;
  merger.connect(o.vol); o.vol.connect(o.lim); o.lim.connect(c.destination);
  return o;
}

function buildVoice(c, sh){
  const cs = (v = 0) => { const s = c.createConstantSource(); s.offset.value = v; s.start(); return s; };
  const g = (v = 1) => { const n = c.createGain(); n.gain.value = v; return n; };
  const v = {note:null, gated:false, held:false, t0:0, key:null};
  v.saw = c.createOscillator(); v.saw.type = 'sawtooth'; v.saw.frequency.value = mtof(60);
  v.sub = c.createOscillator(); v.sub.type = 'square'; v.sub.frequency.value = mtof(48);

  // pulso de largura variável: dente de serra mais deslocamento, cortado por um limiar
  v.pwSum = g(1);
  const shape = c.createWaveShaper(); shape.curve = sh.pwShape; shape.oversample = '4x';
  v.saw.connect(v.pwSum); sh.pwMan.connect(v.pwSum); sh.pwLfo.connect(v.pwSum); v.pwSum.connect(shape);

  v.lvlSaw = g(0); v.lvlPulse = g(0); v.lvlSub = g(0); v.lvlNoise = g(0);
  const mix = g(0.2);
  v.saw.connect(v.lvlSaw); shape.connect(v.lvlPulse); v.sub.connect(v.lvlSub); sh.noise.connect(v.lvlNoise);
  for (const n of [v.lvlSaw, v.lvlPulse, v.lvlSub, v.lvlNoise]) n.connect(mix);

  v.f1 = c.createBiquadFilter(); v.f1.type = 'lowpass';
  v.f2 = c.createBiquadFilter(); v.f2.type = 'lowpass'; v.f2.Q.value = -2;
  v.pre = g(1);
  const drive = c.createWaveShaper(); drive.curve = curve(x => Math.tanh(1.6 * x) / Math.tanh(1.6)); drive.oversample = '2x';
  v.amp = g(0);
  mix.connect(v.f1); v.f1.connect(v.f2); v.f2.connect(v.pre); v.pre.connect(drive); drive.connect(v.amp); v.amp.connect(sh.bus);

  v.env = cs(0); v.gate = cs(0); v.key_ = cs(0);
  v.envAmp = g(0); v.gateAmp = g(0); v.envCut = g(0);
  v.env.connect(v.envAmp); v.envAmp.connect(v.amp.gain);
  v.gate.connect(v.gateAmp); v.gateAmp.connect(v.amp.gain);
  v.env.connect(v.envCut);
  for (const f of [v.f1, v.f2]) { v.envCut.connect(f.detune); sh.lfoCut.connect(f.detune); v.key_.connect(f.detune); sh.bendVcf.connect(f.detune); }
  for (const o of [v.saw, v.sub]) { sh.lfoPitch.connect(o.detune); sh.leverLfo.connect(o.detune); sh.bendDco.connect(o.detune); }
  v.saw.start(); v.sub.start();
  return v;
}

/* iPhone e iPad: o som só liga com um toque solto ou um clique, a chave de silêncio só é ignorada com a sessão "playback", e o contexto pode ser interrompido */
let audioBar = document.getElementById('audio-bar');
function syncAudioBar(){
  if (!audioBar) return;
  audioBar.hidden = !(window.matchMedia('(pointer: coarse)').matches && !(ctx && ctx.state === 'running'));
}
function unlockAudio(){
  ensureAudio();
  try { const b = ctx.createBuffer(1, 1, 22050), s = ctx.createBufferSource(); s.buffer = b; s.connect(ctx.destination); s.start(0); } catch (e) {}
  syncAudioBar();
}
for (const ev of ['touchend', 'pointerup', 'click', 'keydown']) document.addEventListener(ev, () => { if (!ctx || ctx.state !== 'running') unlockAudio(); }, {capture:true, passive:true});
document.addEventListener('visibilitychange', () => { if (!document.hidden && ctx && ctx.state !== 'running') { const r = ctx.resume(); if (r && r.catch) r.catch(() => {}); } });
window.addEventListener('pageshow', syncAudioBar);
if (audioBar) audioBar.addEventListener('click', unlockAudio);
syncAudioBar();

function ensureAudio(){
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    ctx.onstatechange = syncAudioBar;
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    S = buildShared(ctx);
    voices = Array.from({length:NV}, () => buildVoice(ctx, S));
    for (const k in DEF) applyV(k);
    for (const k of Object.keys(SW_OPTS).concat(BOOLS)) applySw(k);
  }
  if (ctx.state !== 'running') { const r = ctx.resume(); if (r && r.catch) r.catch(() => {}); }
}

const smooth = (p, x) => p.setTargetAtTime(x, ctx.currentTime, 0.012);
const eachVoice = fn => voices.forEach(fn);

function applyPw(){
  const x = st.v.pwm, lfoMode = st.sw.pwmSrc === 'lfo';
  smooth(S.pwMan.offset, lfoMode ? 0 : x * .9);
  smooth(S.pwLfo.gain, lfoMode ? x * .45 : 0);
}
function applyV(id){
  if (!S) return;
  const x = st.v[id];
  switch (id) {
    case 'lfoRate': smooth(S.lfo.frequency, lfoHz(x)); break;
    case 'dcoLfo': smooth(S.lfoPitch.gain, x * x * 700); break;
    case 'pwm': applyPw(); break;
    case 'sub': eachVoice(v => smooth(v.lvlSub.gain, x)); break;
    case 'noise': eachVoice(v => smooth(v.lvlNoise.gain, x * .8)); break;
    case 'vcfFreq': eachVoice(v => { smooth(v.f1.frequency, cutHz(x)); smooth(v.f2.frequency, cutHz(x)); }); break;
    case 'vcfRes': eachVoice(v => { smooth(v.f1.Q, x * 24); smooth(v.pre.gain, 1 / (1 + x * 1.6)); }); break;
    case 'vcfEnv': eachVoice(v => smooth(v.envCut.gain, (st.sw.envPol === '-' ? -1 : 1) * x * 6000)); break;
    case 'vcfLfo': smooth(S.lfoCut.gain, x * x * 4800); break;
    case 'vcfKybd': eachVoice(v => { if (v.note !== null) smooth(v.key_.offset, x * (v.note - 60) * 100); }); break;
    case 'vcaLevel': eachVoice(v => { smooth(v.envAmp.gain, st.sw.vcaMode === 'env' ? x : 0); smooth(v.gateAmp.gain, st.sw.vcaMode === 'gate' ? x : 0); }); break;
    case 'bendDco': smooth(S.bendDco.gain, x * 1200); break;
    case 'bendVcf': smooth(S.bendVcf.gain, x * 4800); break;
    case 'bendLfo': smooth(S.leverLfo.gain, x * x * 700); break;
    case 'tune': eachVoice(v => { smooth(v.saw.detune, (x - .5) * 200); smooth(v.sub.detune, (x - .5) * 200); }); break;
    case 'volume': smooth(S.vol.gain, x * x * 1.1); break;
  }
}
function setHpf(){
  const p = st.sw.hpf, now = ctx.currentTime;
  S.shelf.gain.setTargetAtTime(p === '0' ? 8 : 0, now, .02);
  S.hp.frequency.setTargetAtTime(p === '2' ? 240 : p === '3' ? 720 : 10, now, .02);
}
function setChorus(){
  const m = st.sw.chorus, now = ctx.currentTime;
  let rate = .5, base = .0054, depth = .0018, wet = .75, dry = .65;
  if (m === 'off') { wet = 0; dry = 1; }
  else if (m === '2') rate = .83;
  S.chLfo.frequency.setTargetAtTime(rate, now, .02);
  S.dlL.delayTime.setTargetAtTime(base, now, .02); S.dlR.delayTime.setTargetAtTime(base, now, .02);
  S.depL.gain.setTargetAtTime(depth, now, .02); S.depR.gain.setTargetAtTime(-depth, now, .02);
  for (const n of [S.wetL, S.wetR]) n.gain.setTargetAtTime(wet, now, .02);
  for (const n of [S.dryL, S.dryR]) n.gain.setTargetAtTime(dry, now, .02);
}
function applySw(id){
  if (!S) return;
  switch (id) {
    case 'saw': eachVoice(v => smooth(v.lvlSaw.gain, st.sw.saw ? 1 : 0)); break;
    case 'pulse': eachVoice(v => smooth(v.lvlPulse.gain, st.sw.pulse ? 1 : 0)); break;
    case 'pwmSrc': applyPw(); break;
    case 'hpf': setHpf(); break;
    case 'envPol': applyV('vcfEnv'); break;
    case 'vcaMode': applyV('vcaLevel'); break;
    case 'chorus': setChorus(); break;
    case 'range': eachVoice(v => { if (v.note !== null) setPitch(v, v.note, ctx.currentTime, false); }); break;
    case 'hold': if (!st.sw.hold) releaseHeld(); break;
    case 'assign': allNotesOff(); smooth(S.bus.gain, st.sw.assign === 'unison' ? 0.4 : 1); break; // seis vozes em fase somam mais alto
  }
}

/* ---------- vozes ---------- */
function setPitch(v, note, t, glide){
  const m = note + RANGE_SHIFT[st.sw.range] + keyT.semi;
  const tau = st.v.portaTime * st.v.portaTime * 1.5 / 4;
  const targets = [[v.saw.frequency, mtof(m)], [v.sub.frequency, mtof(m - 12)]];
  for (const [p, val] of targets) {
    p.cancelScheduledValues(t);
    if (glide && tau > 0.002) p.setTargetAtTime(val, t, tau); else p.setValueAtTime(val, t);
  }
  v.key_.offset.cancelScheduledValues(t);
  v.key_.offset.setValueAtTime(st.v.vcfKybd * (note - 60) * 100, t);
  v.note = note;
}
function envOn(v, t){
  const e = v.env.offset, a = atkT(st.v.A);
  e.cancelScheduledValues(t);
  e.setTargetAtTime(1, t, Math.max(a / 3, 0.0005));
  e.setTargetAtTime(st.v.S, t + a, Math.max(decT(st.v.D) / 4, 0.001));
}
function envOff(v, t){
  const e = v.env.offset;
  e.cancelScheduledValues(t);
  e.setTargetAtTime(0, t, Math.max(decT(st.v.R) / 4, 0.001));
}
function gateOn(v, t){ v.gate.offset.cancelScheduledValues(t); v.gate.offset.setTargetAtTime(1, t, 0.002); }
function gateOff(v, t){ v.gate.offset.cancelScheduledValues(t); v.gate.offset.setTargetAtTime(0, t, 0.004); }

let rot = -1;
function allocate(){
  if (st.sw.assign === 'poly2') { rot = (rot + 1) % NV; return voices[rot]; } // reveza sempre de 1 a 6
  const free = voices.find(v => !v.gated); // poly 1: primeira voz livre
  if (free) return free;
  return voices.reduce((a, b) => a.t0 <= b.t0 ? a : b);
}
function triggerLfoDelay(t){
  const d = dlyT(st.v.lfoDelay), p = S.lfoFade.gain;
  p.cancelScheduledValues(t);
  if (d < 0.01) { p.setValueAtTime(1, t); return; }
  p.setValueAtTime(0, t); p.setValueAtTime(0, t + d); p.linearRampToValueAtTime(1, t + d + 0.3);
}
function releaseVoice(v, t){ v.gated = false; v.held = false; v.key = null; gateOff(v, t); envOff(v, t); }
function releaseHeld(){
  if (!ctx) return;
  const t = ctx.currentTime;
  voices.forEach(v => { if (v.held) releaseVoice(v, t); });
}

const phys = new Map(); // tecla física → voz (ou true no modo unison)
let uniStack = [];
function allNotesOff(){
  uniStack = []; rot = -1;
  if (!ctx) return;
  const t = ctx.currentTime;
  voices.forEach(v => { if (v.gated) releaseVoice(v, t); });
}
function renderKeyT(){
  if (!ktBtn) return;
  ktBtn.setAttribute('aria-pressed', keyT.on);
  ktOut.textContent = keyT.on ? 'Toque uma tecla' : keyT.semi === 0 ? 'Normal' : signed(keyT.semi) + ' semitons';
}
function keyDown(key){
  ensureAudio();
  if (keyT.on) { // Key Transpose aceso: a tecla define a transposição em vez de tocar
    keyT.semi = Math.max(-12, Math.min(12, key - 60)); keyT.on = false; renderKeyT(); return;
  }
  if (phys.has(key)) return;
  const t = ctx.currentTime + 0.005;
  if (st.sw.hold && phys.size === 0) releaseHeld();
  const idle = !voices.some(v => v.gated);
  if (st.sw.assign === 'unison') { // as seis vozes tocam a mesma nota
    uniStack.push(key);
    voices.forEach(v => {
      const legato = v.gated, glide = st.sw.porta === 'on' && v.note !== null;
      v.t0 = t; v.key = key; v.gated = true; v.held = false; v.seqOff = 0;
      setPitch(v, key, t, glide); envOn(v, t);
      if (!legato) gateOn(v, t);
    });
    if (idle) triggerLfoDelay(t);
    phys.set(key, true); markKey(key, true);
    return;
  }
  const v = allocate();
  const legato = v.gated; // voz roubada ainda soa: reaproveita o gate
  const glide = st.sw.porta === 'on' && v.note !== null;
  v.t0 = t; v.key = key; v.gated = true; v.held = false; v.seqOff = 0;
  setPitch(v, key, t, glide);
  envOn(v, t);
  if (!legato) gateOn(v, t);
  if (idle) triggerLfoDelay(t);
  phys.set(key, v); markKey(key, true);
}
function keyUp(key){
  const v = phys.get(key); if (!v) return;
  phys.delete(key); markKey(key, false);
  if (!ctx) return;
  const t = ctx.currentTime + 0.005;
  if (v === true) { // unison: volta à nota anterior ainda segurada, ou solta tudo
    uniStack = uniStack.filter(k => k !== key);
    if (uniStack.length) {
      const top = uniStack[uniStack.length - 1];
      voices.forEach(x => { x.key = top; setPitch(x, top, t, st.sw.porta === 'on'); });
    } else if (st.sw.hold) voices.forEach(x => { if (x.gated) x.held = true; });
    else voices.forEach(x => { if (x.gated) releaseVoice(x, t); });
    return;
  }
  if (v.key !== key) return; // a voz já foi roubada por outra nota
  if (st.sw.hold) { v.held = true; return; }
  releaseVoice(v, t);
}

const ctlRenderers = [], swRenderers = {};
function attachDrag(el, get, set){
  let sv = 0, sp = 0, active = null;
  el.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    el.setPointerCapture(e.pointerId); active = e.pointerId; sv = get(); sp = e.clientY;
    el.focus({preventScroll:true}); e.preventDefault();
  });
  el.addEventListener('pointermove', e => { if (e.pointerId === active) set(sv + (sp - e.clientY) / (e.shiftKey ? 600 : (el.classList.contains('short') ? 90 : 140))); });
  const end = e => { if (e.pointerId === active) active = null; };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  el.addEventListener('wheel', e => { e.preventDefault(); set(get() - Math.sign(e.deltaY) * (e.shiftKey ? .005 : .02)); }, {passive:false});
  el.addEventListener('keydown', e => {
    const s = e.shiftKey ? .002 : .01, x = get();
    const map = {ArrowUp:x+s, ArrowRight:x+s, ArrowDown:x-s, ArrowLeft:x-s, PageUp:x+.1, PageDown:x-.1, Home:0, End:1};
    if (e.key in map) { e.preventDefault(); e.stopPropagation(); set(map[e.key]); }
  });
}

function makeFader(parent, id, label, fmt, short){
  const wrap = document.createElement('div'); wrap.className = 'ctl';
  const el = document.createElement('div'); el.className = 'fader' + (short ? ' short' : ''); el.tabIndex = 0;
  el.setAttribute('role', 'slider'); el.setAttribute('aria-label', label);
  el.setAttribute('aria-valuemin', '0'); el.setAttribute('aria-valuemax', '100');
  el.innerHTML = '<div class="scale"></div><div class="track"></div><div class="cap"></div>';
  const lab = document.createElement('div'); lab.className = 'ctl-label'; lab.textContent = label;
  const out = document.createElement('div'); out.className = 'ctl-val';
  wrap.append(el, lab, out); parent.append(wrap);
  const render = () => {
    const x = st.v[id], txt = fmt(x);
    el.style.setProperty('--v', x); out.textContent = txt;
    el.setAttribute('aria-valuenow', Math.round(x * 100)); el.setAttribute('aria-valuetext', txt);
  };
  const set = x => {
    x = Math.min(1, Math.max(0, x));
    if (x === st.v[id]) return;

}

function makeStepFader(parent, id, label, fmt){
  const opts = SW_OPTS[id], n = opts.length;
  const wrap = document.createElement('div'); wrap.className = 'ctl';
  const el = document.createElement('div'); el.className = 'fader'; el.tabIndex = 0;
  el.setAttribute('role', 'slider'); el.setAttribute('aria-label', label);
  el.setAttribute('aria-valuemin', '0'); el.setAttribute('aria-valuemax', String(n - 1));
  el.innerHTML = '<div class="scale"></div><div class="track"></div><div class="cap"></div>';
  const lab = document.createElement('div'); lab.className = 'ctl-label'; lab.textContent = label;
  const out = document.createElement('div'); out.className = 'ctl-val';
  wrap.append(el, lab, out); parent.append(wrap);
  const idx = () => Math.max(0, opts.indexOf(st.sw[id]));
  const render = () => {
    const i = idx();
    el.style.setProperty('--v', i / (n - 1)); out.textContent = fmt(i);
    el.setAttribute('aria-valuenow', i); el.setAttribute('aria-valuetext', fmt(i));
  };
  const setIdx = i => {
    i = Math.min(n - 1, Math.max(0, i));
    if (opts[i] === st.sw[id]) return;
    st.sw[id] = opts[i]; render(); applySw(id); save();
  };
  attachDrag(el, () => idx() / (n - 1), x => setIdx(Math.round(x * (n - 1))));
  el.addEventListener('keydown', e => {
    const d = {ArrowUp:1, ArrowRight:1, ArrowDown:-1, ArrowLeft:-1}[e.key];
    if (d) { e.preventDefault(); setIdx(idx() + d); }
    else if (e.key === 'Home') { e.preventDefault(); setIdx(0); }

  });
  el.addEventListener('wheel', e => { e.preventDefault(); setIdx(idx() - Math.sign(e.deltaY)); }, {passive:false});
  el.addEventListener('dblclick', () => setIdx(opts.indexOf(DEF_SW[id])));
  render(); swRenderers[id] = render;
}

/* ---------- sequenciador (acessório) ---------- */
const SEQ_ROWS = 25;
const seqBpm = () => Math.round(50 + st.v.seqTempo * 150);
const seqStepDur = () => 60 / seqBpm() / 4;
const noteName = m => NAMES[m % 12] + (Math.floor(m / 12) - 1);
let seqPlaying = false, seqNext = 0, seqIdx = 0, seqNow = -1, seqClock = null;
const seqQueue = [];

function seqVoice(v, note, t, off){
  v.t0 = t; v.key = null; v.gated = true; v.held = false; v.seqOff = off;
  setPitch(v, note, t, false); envOn(v, t); gateOn(v, t);
  gateOff(v, off); envOff(v, off);
}
function seqStep(i, t){
  const notes = st.seq.steps[i].map(n => n + 12 * st.seq.oct).filter(n => n >= 12 && n <= 120); // transposição da sequência
  if (!notes.length) return;
  const off = t + seqStepDur() * (0.1 + st.v.seqGate * 0.9); // gate: de curto a ligado
  if (st.sw.assign === 'unison') { const n = Math.max(...notes); voices.forEach(v => seqVoice(v, n, t, off)); }
  else notes.forEach(n => seqVoice(allocate(), n, t, off));
}
function seqTick(){
  if (!ctx) return;
  const now = ctx.currentTime;
  voices.forEach(v => { if (v.seqOff && now >= v.seqOff) { v.seqOff = 0; if (v.key === null) v.gated = false; } });
  if (!seqPlaying) return;
  if (seqNext < now - 0.2) seqNext = now + 0.02; // aba ficou em segundo plano
  while (seqNext < now + 0.12) {
    seqIdx %= st.seq.len;
    seqStep(seqIdx, seqNext); seqQueue.push({i:seqIdx, t:seqNext});
    seqNext += seqStepDur(); seqIdx = (seqIdx + 1) % st.seq.len;
  }
}
const startSeqClock = () => { if (!seqClock) seqClock = setInterval(seqTick, 25); };
const playBtn = $('seq-play');
function renderPlay(){ playBtn.setAttribute('aria-pressed', seqPlaying); playBtn.textContent = seqPlaying ? 'Parar' : 'Tocar'; }
function seqPlay(){
  ensureAudio(); startSeqClock();
  if (seqPlaying) return;
  seqPlaying = true; seqIdx = 0; seqQueue.length = 0; seqNext = ctx.currentTime + 0.06;
  triggerLfoDelay(seqNext); seqTick(); requestAnimationFrame(seqDraw); renderPlay();
}
function seqStop(){
  if (!seqPlaying) return;
  seqPlaying = false; seqQueue.length = 0;
  if (ctx) { const t = ctx.currentTime; voices.forEach(v => { if (v.key === null && v.gated) releaseVoice(v, t); v.seqOff = 0; }); }
  setSeqNow(-1); renderPlay();
}
function seqDraw(){
  if (!seqPlaying) return;
  const now = ctx.currentTime; let cur = null;
  while (seqQueue.length && seqQueue[0].t <= now) cur = seqQueue.shift().i;
  if (cur !== null) setSeqNow(cur);
  requestAnimationFrame(seqDraw);
}
function seqPreview(note){
  ensureAudio(); startSeqClock();
  const t = ctx.currentTime + 0.01;
  seqVoice(allocate(), note, t, t + 0.28);
}
playBtn.addEventListener('click', () => seqPlaying ? seqStop() : seqPlay());
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !e.repeat && (e.target === document.body || e.target === document.documentElement)) {
    e.preventDefault(); seqPlaying ? seqStop() : seqPlay();
  }
});

/* grade de notas */
const seqEl = $('seqgrid');
const seqCells = [], seqHeads = [];
function seqBuild(){
  seqEl.innerHTML = ''; seqCells.length = 0; seqHeads.length = 0;
  for (let i = 0; i < 16; i++) seqCells.push([]);
  seqEl.append(document.createElement('div'));
  for (let i = 0; i < 16; i++) {
    const h = document.createElement('div'); h.className = 'sh' + (i % 4 === 0 && i ? ' beat' : ''); h.textContent = i + 1;
    seqEl.append(h); seqHeads.push(h);
  }
  for (let r = 0; r < SEQ_ROWS; r++) {
    const note = st.seq.base + SEQ_ROWS - 1 - r, pc = note % 12, blk = [1,3,6,8,10].includes(pc);
    const l = document.createElement('div'); l.className = 'sl' + (pc === 0 ? ' c' : ''); l.textContent = noteName(note); seqEl.append(l);
    for (let i = 0; i < 16; i++) {
      const b = document.createElement('button'); b.type = 'button';
      b.className = 'sc' + (blk ? ' blk' : '') + (i % 4 === 0 && i ? ' beat' : '');
      b.dataset.step = i; b.dataset.note = note; b.setAttribute('aria-label', `Passo ${i + 1}, ${noteName(note)}`);
      seqEl.append(b); seqCells[i].push(b);
    }
  }
  seqRender();
  const n = seqNow; seqNow = -1; if (n >= 0) setSeqNow(n);
}
function seqRender(){
  const lo = st.seq.base, hi = st.seq.base + SEQ_ROWS - 1;
  for (let i = 0; i < 16; i++) {
    const off = i >= st.seq.len, set = st.seq.steps[i];
    seqHeads[i].classList.toggle('off', off);
    seqHeads[i].classList.toggle('hid', set.some(n => n < lo || n > hi));
    seqHeads[i].title = set.some(n => n < lo || n > hi) ? 'Há notas deste passo fora da janela visível' : '';
    for (const b of seqCells[i]) {
      const on = set.includes(+b.dataset.note);
      b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); b.classList.toggle('off', off);
    }
  }
  $('seq-range').textContent = noteName(lo) + ' a ' + noteName(hi);
  renderTr();
  lenEl.querySelectorAll('button').forEach(b => { const on = +b.dataset.n === st.seq.len; b.setAttribute('aria-checked', on); b.tabIndex = on ? 0 : -1; });
}
function renderTr(){
  const o = st.seq.oct;
  $('seq-tr').textContent = o === 0 ? 'Original' : (o > 0 ? '+' : '−') + Math.abs(o) + (Math.abs(o) === 1 ? ' oitava' : ' oitavas');
}
function setTranspose(d){
  st.seq.oct = Math.max(-2, Math.min(2, st.seq.oct + d)); renderTr(); save();
  if (!seqPlaying) seqPreview(60 + 12 * st.seq.oct); // nota de teste: dá para ouvir a oitava
}
$('seq-tr-down').addEventListener('click', () => setTranspose(-1));
$('seq-tr-up').addEventListener('click', () => setTranspose(1));
function setSeqNow(i){
  if (seqNow >= 0) { seqHeads[seqNow].classList.remove('now'); seqCells[seqNow].forEach(c => c.classList.remove('now')); }
  seqNow = i;
  if (i >= 0) { seqHeads[i].classList.add('now'); seqCells[i].forEach(c => c.classList.add('now')); }
}

/* passos, janela, limpar e exemplo */
const lenEl = $('seq-len');
for (const n of [4, 8, 12, 16]) {
  const b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'radio'); b.dataset.n = n; b.textContent = n;
  b.setAttribute('aria-label', n + ' passos'); lenEl.append(b);
}
lenEl.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { st.seq.len = +b.dataset.n; seqRender(); save(); } });
lenEl.addEventListener('keydown', e => {
  const d = {ArrowRight:1, ArrowDown:1, ArrowLeft:-1, ArrowUp:-1}[e.key]; if (!d) return;
  e.preventDefault(); e.stopPropagation();
  const o = [4, 8, 12, 16], n = o[(o.indexOf(st.seq.len) + d + 4) % 4];
  st.seq.len = n; seqRender(); save(); lenEl.querySelector(`[data-n="${n}"]`).focus();
});
$('seq-oct-down').addEventListener('click', () => { st.seq.base = Math.max(36, st.seq.base - 12); seqBuild(); save(); });
$('seq-oct-up').addEventListener('click', () => { st.seq.base = Math.min(72, st.seq.base + 12); seqBuild(); save(); });
$('seq-clear').addEventListener('click', () => { st.seq.steps = Array.from({length:16}, () => []); seqRender(); save(); });
$('seq-example').addEventListener('click', () => { st.seq.steps = exampleSteps(); st.seq.len = 16; st.seq.base = 48; st.seq.oct = 0; seqBuild(); save(); });

/* pintar notas: clique, arrasto (mouse e caneta) e teclado */
function seqSet(b, on){
  const i = +b.dataset.step, n = +b.dataset.note, arr = st.seq.steps[i];
  if (arr.includes(n) === on) return false;
  if (on) { if (arr.length >= NV) return false; arr.push(n); arr.sort((x, y) => x - y); }
  else arr.splice(arr.indexOf(n), 1);
  b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
  seqHeads[i].classList.toggle('hid', arr.some(m => m < st.seq.base || m > st.seq.base + SEQ_ROWS - 1));
  return true;
}
const cellAt = (x, y) => { const el = document.elementFromPoint(x, y); const b = el && el.closest ? el.closest('button.sc') : null; return b && seqEl.contains(b) ? b : null; };
let seqDrag = null, seqSuppress = 0;
seqEl.addEventListener('click', e => {
  const b = e.target.closest('button.sc'); if (!b) return;
  if (e.detail > 0 && performance.now() < seqSuppress) return; // já tratado pelo arrasto
  const on = !st.seq.steps[+b.dataset.step].includes(+b.dataset.note);
  seqSet(b, on); if (on && !seqPlaying) seqPreview(+b.dataset.note); save();
});
seqEl.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch' || e.button !== 0) return; // no toque, arrastar rola a grade
  const b = e.target.closest('button.sc'); if (!b) return;
  const on = !st.seq.steps[+b.dataset.step].includes(+b.dataset.note);
  seqDrag = {on, x:e.clientX, y:e.clientY}; seqSuppress = Infinity;
  seqSet(b, on); if (on && !seqPlaying) seqPreview(+b.dataset.note);
});
window.addEventListener('pointermove', e => {
  if (!seqDrag) return;
  if (e.buttons === 0) { endSeqDrag(); return; }
  const dx = e.clientX - seqDrag.x, dy = e.clientY - seqDrag.y, n = Math.max(1, Math.ceil(Math.hypot(dx, dy) / 6));
  for (let k = 1; k <= n; k++) { const c = cellAt(seqDrag.x + dx * k / n, seqDrag.y + dy * k / n); if (c) seqSet(c, seqDrag.on); }
  seqDrag.x = e.clientX; seqDrag.y = e.clientY;
});
function endSeqDrag(){ if (!seqDrag) return; seqDrag = null; seqSuppress = performance.now() + 400; save(); }
window.addEventListener('pointerup', endSeqDrag);
window.addEventListener('pointercancel', endSeqDrag);
window.addEventListener('blur', endSeqDrag);

makeKnob($('seq-knobs'), 'seqTempo', 'Tempo', x => Math.round(50 + x * 150) + ' BPM');
makeKnob($('seq-knobs'), 'seqGate', 'Gate', x => Math.round((0.1 + x * 0.9) * 100) + '%');
seqBuild(); renderPlay();

/* ---------- alavanca ---------- */
const leverEl = $('lever');
let bendX = 0, leverY = 0;
function setLever(x, y){
  bendX = Math.max(-1, Math.min(1, x)); leverY = Math.max(0, Math.min(1, y));
  leverEl.style.setProperty('--bx', bendX); leverEl.style.setProperty('--my', leverY);
  leverEl.setAttribute('aria-valuenow', Math.round(bendX * 100));
  if (S) { const n = ctx.currentTime; S.bender.offset.setTargetAtTime(bendX, n, 0.01); S.lever.offset.setTargetAtTime(leverY, n, 0.01); }
}
(() => {
  let active = null;
  const fromEvent = e => {
    const r = leverEl.getBoundingClientRect();
    const x = ((e.clientX - r.left) / r.width) * 2 - 1;
    const y = ((r.height - 28) - (e.clientY - r.top)) / (r.height - 62); // zero no centro do botão em repouso
    return [x, y];
  };
  leverEl.addEventListener('pointerdown', e => {
    ensureAudio(); leverEl.setPointerCapture(e.pointerId); active = e.pointerId;
    leverEl.classList.add('drag'); const [x, y] = fromEvent(e); setLever(x, y); e.preventDefault();
  });
  leverEl.addEventListener('pointermove', e => { if (e.pointerId === active) { const [x, y] = fromEvent(e); setLever(x, y); } });
  const end = e => { if (e.pointerId !== active) return; active = null; leverEl.classList.remove('drag'); setLever(0, 0); };
  leverEl.addEventListener('pointerup', end); leverEl.addEventListener('pointercancel', end);
  leverEl.addEventListener('keydown', e => {
    const m = {ArrowRight:[.25,0], ArrowLeft:[-.25,0], ArrowUp:[0,.25], ArrowDown:[0,-.25]}[e.key]; if (!m) return;
    e.preventDefault(); e.stopPropagation(); ensureAudio();
    setLever(bendX + m[0], leverY + m[1]);
  });
  leverEl.addEventListener('keyup', e => { if (e.key.startsWith('Arrow')) setLever(0, 0); });
})();

/* ---------- teclado na tela ---------- */
const kb = $('kb'), keyEls = {};
const whites = [];
for (let m = KEY_LO; m <= KEY_HI; m++) if (![1,3,6,8,10].includes(m % 12)) whites.push(m);
const W = 100 / whites.length;
whites.forEach(m => {
  const k = document.createElement('div'); k.className = 'key w'; k.dataset.key = m;
  k.setAttribute('aria-label', NAMES[m % 12] + (Math.floor(m / 12) - 1));
  kb.append(k); keyEls[m] = k;
});
for (let m = KEY_LO; m <= KEY_HI; m++) {
  if (![1,3,6,8,10].includes(m % 12)) continue;
  const left = whites.indexOf(m + 1) * W;
  const k = document.createElement('div'); k.className = 'key b'; k.dataset.key = m;
  k.setAttribute('aria-label', NAMES[m % 12] + (Math.floor(m / 12) - 1));
  k.style.left = `calc(${left}% - ${W * 0.31}%)`; k.style.width = `${W * 0.62}%`;
  kb.append(k); keyEls[m] = k;
}
function markKey(m, on){ if (keyEls[m]) keyEls[m].classList.toggle('down', on); }

const pointerKey = new Map();
const keyAt = (x, y) => { const el = document.elementFromPoint(x, y); return el && el.closest && el.closest('.key') ? +el.closest('.key').dataset.key : null; };
kb.addEventListener('pointerdown', e => {
  const k = keyAt(e.clientX, e.clientY); if (k === null) return;
  kb.setPointerCapture(e.pointerId); pointerKey.set(e.pointerId, k); keyDown(k); e.preventDefault();
});
kb.addEventListener('pointermove', e => {
  if (!pointerKey.has(e.pointerId)) return;
  const k = keyAt(e.clientX, e.clientY), old = pointerKey.get(e.pointerId);
  if (k === null || k === old) return;
  pointerKey.set(e.pointerId, k); keyDown(k); keyUp(old);
});
const kbEnd = e => { if (!pointerKey.has(e.pointerId)) return; keyUp(pointerKey.get(e.pointerId)); pointerKey.delete(e.pointerId); };
kb.addEventListener('pointerup', kbEnd); kb.addEventListener('pointercancel', kbEnd);

/* teclado largo no toque: botões para rolar e início perto do C central */
const kbWrap = kb.parentElement;
const kbScroll = d => kbWrap.scrollBy({left: d * kb.scrollWidth / whites.length * 7, behavior: 'smooth'});
$('kb-left').addEventListener('click', () => kbScroll(-1));
$('kb-right').addEventListener('click', () => kbScroll(1));
if (window.matchMedia('(pointer: coarse)').matches && kbWrap.scrollWidth > kbWrap.clientWidth)
  kbWrap.scrollLeft = Math.max(0, whites.indexOf(60) / whites.length * kb.scrollWidth - kbWrap.clientWidth * 0.3);

/* ---------- teclado do computador ---------- */
const KMAP = {a:0, w:1, s:2, e:3, d:4, f:5, t:6, g:7, y:8, h:9, u:10, j:11, k:12, o:13, l:14, p:15, 'ç':16, ';':16};
let kbBase = 60;
const compHeld = new Map();
document.addEventListener('keydown', e => {
  if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  const ch = e.key.toLowerCase();
  if (ch === 'z') { kbBase = Math.max(36, kbBase - 12); return; }
  if (ch === 'x') { kbBase = Math.min(84, kbBase + 12); return; }
  if (!(ch in KMAP) || compHeld.has(ch)) return;
  const m = Math.min(KEY_HI, kbBase + KMAP[ch]); compHeld.set(ch, m); keyDown(m);
});
document.addEventListener('keyup', e => {
  const ch = e.key.toLowerCase();
  if (!compHeld.has(ch)) return;
  keyUp(compHeld.get(ch)); compHeld.delete(ch);
});
window.addEventListener('blur', () => {
  for (const m of compHeld.values()) keyUp(m); compHeld.clear();
  for (const m of pointerKey.values()) keyUp(m); pointerKey.clear();
});
})();
</script>
